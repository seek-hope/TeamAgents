[package]
name = "teamagents-engine"
version = "0.1.2"
edition = "2021"

[dependencies]
teamagents-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
url = "2"
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
# Async transport. Keep exactly one production HTTP stack: do not add a second
# one next to hyper (the synchronous ureq path is gone).
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "signal"] }
# "http2" is required for ALPN: without it hyper-rustls advertises no ALPN at
# all and edges that require ALPN (e.g. the apexin relay) drop the handshake.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
futures-util = { version = "0.3", default-features = false }
# Process-group signalling with identity verification (jobs runner, §6.2).
libc = "0.2"

[dev-dependencies]

[lib]
name = "teamagents_engine"
path = "src/lib.rs"

[[bin]]
name = "teamagents"
path = "src/main.rs"

[[bin]]
name = "fake-mcp-server"
path = "src/bin/fake-mcp-server.rs"
