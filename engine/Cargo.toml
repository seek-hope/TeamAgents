[package]
name = "teamagents-engine"
version = "0.1.2"
edition = "2021"

[dependencies]
teamagents-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
url = "2"
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
# R2 async transport (locked by the R2-P0 contract). The legacy ureq stack is
# removed together with the old chat loop; do not add a third HTTP stack.
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "signal"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
libc = "0.2"

[lib]
name = "teamagents_engine"
path = "src/lib.rs"

[[bin]]
name = "teamagents"
path = "src/main.rs"

[[bin]]
name = "fake-codex"
path = "src/bin/fake-codex.rs"

[[bin]]
name = "fake-mcp-server"
path = "src/bin/fake-mcp-server.rs"
