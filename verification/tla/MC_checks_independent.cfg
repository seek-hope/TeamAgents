\* D-393: the goal requires a round another instance registered, and the rule is in place, so it settles only on a
\* verifier's round (`SelfVerified = FALSE`, `Independent = TRUE`).
SPECIFICATION Spec
CONSTANTS
    AllChecks = {"k1", "k2"}
    Independent = TRUE
    SelfVerified = FALSE
    RewindRounds = FALSE
    LateRequire = FALSE
    MaxRounds = 2
INVARIANTS
    TypeOK
    EveryRequiredCheckWasVerified
    IndependenceIsNotSelfVerified
    NoUpgradeOfTheCandidate
    RoundsAreMonotone
    RoundsAreBounded
    NoUnverifiedSuccess
