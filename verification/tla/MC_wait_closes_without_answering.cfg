\* Negative control (D-220): the pre-V-W1 shape — a wait satisfied at
\* registration, and a superseded wait, both close without answering their
\* tool_call. A strict wire endpoint rejects the next request whose assistant
\* tool_calls have no matching tool response, which is what the fix and
\* `ResolvedWaitIsAnswered` are for. The fix ledger records this refutation
\* against the configuration its rename took away; TLC must report the invariant
\* violated again, and the same configuration with `CloseWithoutAnswer = FALSE`
\* (MC_wait.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Waits = {"w1", "w2"}
    Conds = {"c1", "c2"}
    Instances = {"L", "M"}
    CloseWithoutAnswer = TRUE
INVARIANTS
    TypeOK
    ResolvedWaitIsAnswered
    WakeAnswersItsCall
