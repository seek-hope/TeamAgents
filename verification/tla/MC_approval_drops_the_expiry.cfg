\* Negative control (D-225): dispatch ignores the horizon, so an approval whose
\* window has passed still authorizes the effect — the mistake the `expires_at`
\* check in the dispatch re-check prevents. TLC must report `NoLateEffect`
\* violated; the same configuration with `DropsExpiryCheck = FALSE`
\* (MC_approval.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Ops = {"o1", "o2"}
    MaxTime = 3
    DropsExpiryCheck = TRUE
    RewritesDecisions = FALSE
    KeepsPendingOnClose = FALSE
    ParksWithoutARow = FALSE
INVARIANTS
    TypeOK
    NoLateEffect
    EffectImpliesApproved
