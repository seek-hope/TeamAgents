\* Negative control (D-410): the runtime warns the same goal again on every step near its deadline. One note is
\* a signal; a note per step is the turn storm (D-65) in the runtime's own voice. TLC must report
\* `AtMostOneWarning` violated; MC_control_warn.cfg is the same configuration with `WarnRepeatedly = FALSE` and
\* verifies.
SPECIFICATION Spec
CONSTANTS
    Instances = {"L"}
    Ops = {"o1"}
    ReqIds = {1, 2}
    AttIds = {1}
    ApprovalOps = {"o1"}
    TokenLimit = 2
    MaxEpoch = 1
    MaxUnknown = 1
    WarnLate = FALSE
    WarnRepeatedly = TRUE
    MaxWarns = 2
    AllowMidTurnInput = FALSE
    ReaskAfterReply = FALSE
    RuntimeTailIsWork = FALSE
    IgnoreDeadline = FALSE
    ReleaseOnCancel = TRUE
    PerInstanceFairness = TRUE
INVARIANTS
    TypeOK
    AtMostOneWarning
PROPERTIES
    WarnIsTimely
