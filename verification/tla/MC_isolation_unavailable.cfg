\* Negative control (D-369): a command may run under a backend the probe refused. TLC must refute
\* `UnavailableBackendNeverRuns`.
SPECIFICATION Spec
CONSTANTS
    Backends = {"bubblewrap", "docker", "host"}
    Configured = "docker"
    Available = {"bubblewrap"}
    AllowFallback = FALSE
    AllowUnavailable = TRUE
INVARIANTS
    TypeOK
    RunsOnlyUnderTheConfiguredBackend
    UnavailableBackendNeverRuns
