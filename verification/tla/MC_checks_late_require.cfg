\* expects: EveryRequiredCheckWasVerified
\* Negative control (D-385): a check joins the contract after the claim, so the registered round never runs it.
\* TLC must report `EveryRequiredCheckWasVerified` violated.
SPECIFICATION Spec
CONSTANTS
    AllChecks = {"k1", "k2"}
    Independent = FALSE
    SelfVerified = FALSE
    RewindRounds = FALSE
    LateRequire = TRUE
    BriefWithoutChecks = FALSE
    MaxRounds = 2
    BriefTwice = FALSE
    RoundWithoutClaim = FALSE
    UpgradeCandidate = FALSE
    UnverifiedAccept = FALSE
    UnboundedRounds = FALSE
    BlockWithoutCause = FALSE
INVARIANTS
    TypeOK
    EveryRequiredCheckWasVerified
