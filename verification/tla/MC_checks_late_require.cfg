\* Negative control (D-385): a check may join the contract *after* the model claimed
\* success. The registered round was computed over the smaller set, so the new check
\* is never run — the driver would accept the goal on the round's own receipts while
\* `limits.required_checks` names a check nobody verified. TLC must report
\* `EveryRequiredCheckWasVerified` violated; with `LateRequire = FALSE` (MC_checks.cfg)
\* the same property verifies. `require_checks` refuses a goal that has registered a
\* round for exactly this reason.
SPECIFICATION Spec
CONSTANTS
    AllChecks = {"k1", "k2"}
    MaxRounds = 2
    RewindRounds = FALSE
    LateRequire = TRUE
INVARIANTS
    TypeOK
    EveryRequiredCheckWasVerified
