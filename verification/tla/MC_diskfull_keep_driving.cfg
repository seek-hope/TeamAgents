\* Negative control (A31): the driver keeps running steps while latched — the dispatch
\* storm the latch exists to stop, and the failed step retried on the next pass.
\* TLC must report `NoStepRunsWhileLatched` violated.
SPECIFICATION Spec
CONSTANTS
    KeepDriving = TRUE
    FakeSuccess = FALSE
    ParkSilently = FALSE
    ClearAnyway = FALSE
INVARIANTS
    TypeOK
    NoStepRunsWhileLatched
    NoFakedSuccess
    LossIsReported
    LatchClearsOnlyWhenWritable
PROPERTIES
    ParkEventuallyLands
