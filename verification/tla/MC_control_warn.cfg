\* D-410: the warning rules, on the same session MC.cfg models. TLC must verify `AtMostOneWarning` and
\* `WarnIsTimely`; MC_control_warn_late.cfg and MC_control_warn_repeat.cfg are the counterfactuals that must be
\* refuted (a warning after the deadline, a warning repeated).
SPECIFICATION Spec
CONSTANTS
    Instances = {"L"}
    Ops = {"o1"}
    ReqIds = {1, 2}
    AttIds = {1}
    ApprovalOps = {"o1"}
    TokenLimit = 2
    MaxEpoch = 1
    MaxUnknown = 1
    WarnLate = FALSE
    WarnRepeatedly = FALSE
    MaxWarns = 2
    AllowMidTurnInput = FALSE
    ReaskAfterReply = FALSE
    RuntimeTailIsWork = FALSE
    IgnoreDeadline = FALSE
    ReleaseOnCancel = TRUE
    PerInstanceFairness = TRUE
INVARIANTS
    TypeOK
    AtMostOneWarning
PROPERTIES
    WarnIsTimely
