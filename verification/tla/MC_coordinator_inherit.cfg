\* Negative control (A33): the child's descriptor survives exec, so a long tool
\* child keeps the lock after the coordinator is gone. TLC must report
\* `NoHeldLockWithoutAHolder` violated — recovery would be blocked by a tool.
SPECIFICATION Spec
CONSTANTS
    ReportInsteadOfWaiting = FALSE
    ChildKeepsLock = TRUE
    NotExclusive = FALSE
INVARIANTS
    TypeOK
    AtMostOneCoordinator
    TheWindowIsNotMistakenForAHolder
    NoHeldLockWithoutAHolder
PROPERTIES
    RecoveryIsLive
