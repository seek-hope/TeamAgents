\* Negative control (D-61): dispatch trusts the cached model-visible surface
\* instead of re-reading the live grants at the linearization point — the mistake
\* §6.1/A04 forbids. With the surface refreshed per request (the code) the same
\* configuration verifies.
\* TLC must report `AuthorizedEffectsOnly` violated: the worker's shell is still on
\* its cached surface after the user revoked the grant, and an operation prepared
\* after that revocation takes effect.
SPECIFICATION Spec
CONSTANTS
    Instances = {"leader", "worker"}
    Actions = {"shell", "manage", "delegate", "message", "task_result"}
    GrantIds = {"g1", "g2", "g3", "g4"}
    BaseTools = {"files"}
    ViewFields = {"id", "issuer", "subject", "action", "scope", "revoked"}
    Granter = "user"
    TrustSurface = TRUE
    RefreshSurface = TRUE
INVARIANTS
    TypeOK
    NoDeadGrantPair
    ListedIdsAreUsed
    AuthorityTracesToTheUser
    RevokedStaysRevoked
    ChildGrantsAreCoveredByTheirParent
    CascadeTakesTheSubtree
    EffectAtMostOnce
    OnceStaleNeverExecutes
    BootstrappedAuthority
PROPERTIES
    AuthorizedEffectsOnly
