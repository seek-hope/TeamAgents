\* Negative control (D-218): delegation ignores the goal's status — the shape of
\* finding V-G1 before it was fixed, when a settled goal could still take new
\* work. TLC must report `RegisteredWorkNeedsAnActiveGoal` violated (a task is
\* delegated onto a goal that has already settled, which is the `lateTask` the
\* monitor records); the same configuration with `DelegateToSettledGoal = FALSE`
\* (MC_task.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Tasks = {"t1"}
    Instances = {"L", "W"}
    Goals = {"g1", "g2"}
    MaxOps = 1
    DelegateToSettledGoal = TRUE
    BillSettledGoal = FALSE
    AllowUnorderedDependency = FALSE
    LeaveTasksOnTerminate = FALSE
INVARIANTS
    TypeOK
    SystemOnlyParksTasks
    OnlyPartiesWriteTasks
    ReturnPathOnlyWhileOpen
    DependenciesPointBackwards
    NoSelfDependency
    NoOpenTaskOnDeadAssignee
    SettledIsFinal
    NoStaleActiveGoal
    RegisteredWorkNeedsAnActiveGoal
    RequestsResolveToActiveGoals
