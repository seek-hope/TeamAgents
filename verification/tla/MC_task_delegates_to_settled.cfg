\* expects: RegisteredWorkNeedsAnActiveWork
\* Negative control (D-218): delegation ignores the work's status — the shape of
\* finding V-G1 before it was fixed, when a settled work could still take new
\* work. TLC must report `RegisteredWorkNeedsAnActiveWork` violated (a task is
\* delegated onto a work that has already settled, which is the `lateTask` the
\* monitor records); the same configuration with `DelegateToSettledWork = FALSE`
\* (MC_task.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Tasks = {"t1"}
    Instances = {"L", "W"}
    Works = {"g1", "g2"}
    MaxOps = 1
    DelegateToSettledWork = TRUE
    BillSettledWork = FALSE
    AllowUnorderedDependency = FALSE
    LeaveTasksOnTerminate = FALSE
    StrangerWrites = FALSE
    ReturnPathClosed = FALSE
    RewriteSettled = FALSE
    SystemSettles = FALSE
    SelfDependency = FALSE
    StaleActiveWork = FALSE
INVARIANTS
    TypeOK
    SystemOnlyParksTasks
    OnlyPartiesWriteTasks
    ReturnPathOnlyWhileOpen
    DependenciesPointBackwards
    NoSelfDependency
    NoOpenTaskOnDeadAssignee
    SettledIsFinal
    NoStaleActiveWork
    RegisteredWorkNeedsAnActiveWork
    RequestsResolveToActiveWorks
