\* Negative control (D-65): the runtime re-opens a turn while the last word is the
\* model's own — what the code did whenever the instance still had an open task, so
\* a model that answers with prose instead of settling its task was asked again,
\* and again (measured: 169 requests / 1,226,717 prompt tokens without progress).
\* TLC must report `NoTurnWithoutWork` violated; MC.cfg is the same configuration
\* with `ReaskAfterReply = FALSE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Instances = {"L"}
    Ops = {"o1"}
    ReqIds = {1, 2}
    AttIds = {1}
    ApprovalOps = {"o1"}
    TokenLimit = 2
    MaxEpoch = 1
    MaxUnknown = 1
    AllowMidTurnInput = FALSE
    ReaskAfterReply = TRUE
    IgnoreDeadline = FALSE
    PerInstanceFairness = TRUE
INVARIANTS
    TypeOK
    NoTurnWithoutWork
    InputLandsAtTheBoundary
PROPERTIES
