\* Negative control (D-225): a decided approval is rewritten — DENIED becomes
\* APPROVED, or an expired one comes back — which is what "a decision is final"
\* forbids and what `change_approval`'s `status = 'PENDING'` guard prevents. TLC
\* must report `ApprovalDecisionIsFinal` violated; the same configuration with
\* `RewritesDecisions = FALSE` (MC_approval.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Ops = {"o1", "o2"}
    MaxTime = 3
    DropsExpiryCheck = FALSE
    RewritesDecisions = TRUE
    KeepsPendingOnClose = FALSE
    ParksWithoutARow = FALSE
INVARIANTS
    TypeOK
    ApprovalDecisionIsFinal
