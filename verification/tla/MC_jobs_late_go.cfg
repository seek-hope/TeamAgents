\* Negative control (A10/A13): CANCEL before the start does not stay final, so a
\* late GO starts the command. TLC must report `LateGoIsRejected` violated.
SPECIFICATION Spec
CONSTANTS
    GuessNotRun = FALSE
    DoubleGo = FALSE
    LateGoStarts = TRUE
    SpawnBeforeAccept = FALSE
    RetireWithAChild = FALSE
INVARIANTS
    TypeOK
    AtMostOneExecutor
    LateGoIsRejected
    UnverifiableStartIsNeverGuessedNotRun
    NotRunMeansNoEffect
    NoEffectBeforeAccept
    EffectImpliesAcceptedStart
PROPERTIES
    SettledRunnerLeaves
