\* Negative control (D-91/A10/A11): a dead runner is judged "did not run" whenever
\* its pid is gone, journal or not — the shape the recovery contract forbids. TLC
\* must report `UnverifiableStartIsNeverGuessedNotRun` violated (and with it
\* `NotRunMeansNoEffect`, which is the point: a "did not run" verdict in front of a
\* command that ran).
SPECIFICATION Spec
CONSTANTS
    GuessNotRun = TRUE
    DoubleGo = FALSE
    LateGoStarts = FALSE
    SpawnBeforeAccept = FALSE
    RetireWithAChild = FALSE
INVARIANTS
    TypeOK
    AtMostOneExecutor
    LateGoIsRejected
    UnverifiableStartIsNeverGuessedNotRun
    NotRunMeansNoEffect
    NoEffectBeforeAccept
    EffectImpliesAcceptedStart
PROPERTIES
    SettledRunnerLeaves
