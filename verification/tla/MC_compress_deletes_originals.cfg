\* expects: NoEntryIsEverLost
\* Negative control (D-219): compression deletes the entries a summary covers —
\* the naive "the summary replaces the originals" — instead of hiding them. TLC
\* must report `NoEntryIsEverLost` violated (the `lost` monitor is written for the
\* first time); the same configuration with `DeleteCoveredEntries = FALSE`
\* (MC_compress.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Slots = {0, 1, 2, 3, 4}
    Reqs = {"r1", "r2"}
    DeleteCoveredEntries = TRUE
    ReopenCoveredEntries = FALSE
    ReopenClosedRequest = FALSE
    AppendInHole = FALSE
    KeepReservation = FALSE
    CoverBackwards = FALSE
    CoverToNonSummary = FALSE
    CoverSelf = FALSE
INVARIANTS
    TypeOK
    NoEntryIsEverLost
    RequestClosesOnce
