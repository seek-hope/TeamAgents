\* expects: NothingIsReleasedInsideTheWindow
\* Negative control (D-436): a hold is released although the artifact is still *inside* the retention window —
\* the mistake `NothingIsReleasedInsideTheWindow` exists to catch. `a3` is spent and inside the window, so only
\* that guard can stop this. (The first version of this configuration verified instead of refuting: every
\* artifact outside `Aged` was also outside `Spent`, so the other guard always fired first.)
SPECIFICATION Spec
CONSTANTS
    Artifacts = {"a1", "a2", "a3"}
    Owners = {"r1", "r2"}
    \* Each guard gets a session of its own, so neither counterfactual is masked by the other — the lesson the
    \* Prune configurations learned first (D-435) and this one had to learn again: `a1` is spent *and* aged (the
    \* legitimate release), `a2` is aged but its owner is still live, `a3` is spent but inside the window.
    Spent = {"a1", "a3"}
    Aged = {"a1", "a2"}
    GcIgnoresHolders = FALSE
    ReleaseLiveOwner = FALSE
    ReleaseFreshArtifact = TRUE
    ReferenceUnpersisted = FALSE
    ReleaseDeletesBytes = FALSE
    CollectorKeepsGhost = FALSE
    ReferenceToStaging = FALSE
    DeleteAnyone = FALSE
    ClaimAnyone = FALSE
    LiveWithoutReference = FALSE
INVARIANTS
    TypeOK
    NothingIsReleasedInsideTheWindow
