\* Negative control (D-291): a read hands over a committed event that is not the cursor's next one — a page
\* assembled from the wrong end, or a listing that raced the writer — so the reader's view is no longer the
\* committed prefix. TLC must report `ReadersSeeTheCommittedPrefix` violated; the same configuration with
\* `ReaderMaySkip = FALSE` (MC_concurrency.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Readers = {"r1", "r2"}
    MaxEvents = 3
    WriterWaitsForReaders = FALSE
    ReaderMaySkip = TRUE
    ReaderMayRunAhead = FALSE
INVARIANTS
    TypeOK
    ReadersSeeTheCommittedPrefix
    NoReaderSeesUncommitted
