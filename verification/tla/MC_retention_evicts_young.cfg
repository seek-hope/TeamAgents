\* Negative control (D-192): the sweep forgets the horizon, so history younger
\* than `history_days` is dropped. TLC must refute `OnlyOldFactsAreEvicted`
\* (and the step property with it).
SPECIFICATION Spec
CONSTANTS
    Facts = {"e1", "e2", "e3"}
    Live0 = {"e2"}
    Evidence0 = {"e3"}
    Horizon = 2
    MaxAge = 3
    IgnoreLive = FALSE
    IgnoreEvidence = FALSE
    IgnoreAge = TRUE
    IgnoreDisabled = FALSE
INVARIANTS
    TypeOK
    NoReferenceToEvictedFact
    EvidenceIsNeverEvicted
    OnlyOldFactsAreEvicted
PROPERTIES
    EvictionOnlyUnderTheGuards
