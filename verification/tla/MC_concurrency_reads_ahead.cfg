\* Negative control (D-291): a read hands over an event the writer has not committed — a cursor moved past the
\* log it is supposed to follow — so a reader sees work that does not exist yet. TLC must report
\* `NoReaderSeesUncommitted` violated; the same configuration with `ReaderMayRunAhead = FALSE`
\* (MC_concurrency.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Readers = {"r1", "r2"}
    MaxEvents = 3
    WriterWaitsForReaders = FALSE
    ReaderMaySkip = FALSE
    ReaderMayRunAhead = TRUE
INVARIANTS
    TypeOK
    ReadersSeeTheCommittedPrefix
    NoReaderSeesUncommitted
