\* expects: InterruptedRollbackSettlesToThePreviousVersion
\* Negative control (D-462): settling an interrupted rollback keeps the new version.
SPECIFICATION Spec
CONSTANTS
    Updaters = {"u1", "u2"}
    Versions = {"v1", "v2"}
    MaxRevision = 4
    IgnoreLock = FALSE
    RewriteJournal = FALSE
    SkipValidation = FALSE
    KeepBothActive = FALSE
    FreshInstall = FALSE
    CrashSwitches = FALSE
    RollbackAnyway = FALSE
    FinishAnyway = FALSE
