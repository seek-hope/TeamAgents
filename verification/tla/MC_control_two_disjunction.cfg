\* Negative control (D-63): the same two-instance configuration with the *older*
\* fairness form — one disjunction over instances
\* (`WF_vars(\E i \in Instances : Recover(i))`, as the model had before) instead of
\* per-instance fairness. It looks equivalent and is not: one instance can stay dead
\* while the other recovers again and again, so its queued input never enters the
\* context. The code has one driver per instance (the supervisor drives and restarts
\* them one by one), so per-instance fairness is the faithful model.
\* TLC must report `QueuedInputEntersTheContext` violated; MC_control_two.cfg is the
\* same configuration with `PerInstanceFairness = TRUE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Instances = {"L", "W"}
    Ops = {"o1"}
    ReqIds = {1, 2}
    AttIds = {1}
    ApprovalOps = {}
    TokenLimit = 2
    MaxEpoch = 0
    MaxUnknown = 0
    AllowMidTurnInput = FALSE
    ReaskAfterReply = FALSE
    RuntimeTailIsWork = FALSE
    IgnoreDeadline = FALSE
    PerInstanceFairness = FALSE
INVARIANTS
    TypeOK
    InputLandsAtTheBoundary
PROPERTIES
    QueuedInputEntersTheContext
