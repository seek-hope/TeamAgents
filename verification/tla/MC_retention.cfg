    IgnoreEvidence = FALSE
    IgnoreAge = FALSE
    IgnoreDisabled = FALSE
INVARIANTS
    TypeOK
    NoReferenceToEvictedFact
    EvidenceIsNeverEvicted
    OnlyOldFactsAreEvicted
PROPERTIES
    EvictionOnlyUnderTheGuards
