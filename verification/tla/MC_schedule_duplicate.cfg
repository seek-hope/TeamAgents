\* Negative control (D-367): a run does not advance the slot, so the same slot runs twice.
\* TLC must refute `NoDuplicateRun`.
SPECIFICATION Spec
CONSTANTS
    Automations = {"a1", "a2"}
    MaxTime = 3
    AllowDuplicate = TRUE
    AllowOverlap = FALSE
    AllowDisabled = FALSE
    AllowEarly = FALSE
INVARIANTS
    TypeOK
    NoDuplicateRun
    AtMostOneRunPerAutomation
    DisabledNeverRuns
    OnlyDueSlotsRun
