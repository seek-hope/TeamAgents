\* Negative control (D-412): one authorization code is exchanged twice, so a leaked redirect URL buys a
\* second credential. TLC must report `CodesAreSingleUse` violated; MC_oauth.cfg is the same configuration
\* with `ReuseCode = FALSE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Services = {"s1"}
    Resources = {"r1", "r2"}
    Codes = {"c1", "c2"}
    Tokens = {"t1", "t2"}
    Refreshable = {"s1"}
    MaxLife = 3
    MaxClock = 6
    IgnoreResource = FALSE
    ReuseCode = TRUE
    LeakVerifier = FALSE
    IgnoreExpiry = FALSE
    IgnoreLogout = FALSE
INVARIANTS
    TypeOK
    CodesAreSingleUse
