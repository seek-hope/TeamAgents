\* Negative control (§5.1): any instance may drain any inbox. TLC must report
\* `DrainIsOwned` violated — the drain's identity check is what keeps one
\* instance out of another's inbox.
SPECIFICATION Spec
CONSTANTS
    MaxInbox = 2
    ApplyWithoutDedup = FALSE
    DropWhenFull = FALSE
    OverflowInbox = FALSE
    ApplySealed = FALSE
    AnyInstanceDrains = TRUE
INVARIANTS
    TypeOK
    AtMostOncePerEnvelope
    LogIsIncreasing
    NoSilentLoss
    NoStaleApplication
    DrainIsOwned
    BoundedInbox
