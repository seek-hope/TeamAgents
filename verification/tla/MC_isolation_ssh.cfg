\* The ssh backend (D-437), under the same two rules: a session whose sandbox is another host runs its commands
\* under that backend and nowhere else. The backend list gains `ssh`, and the two controls beside this one are the
\* failures ssh makes plausible — a host that does not answer, and a fallback that would run the command here.
SPECIFICATION Spec
CONSTANTS
    Backends = {"bubblewrap", "docker", "ssh", "host"}
    Configured = "ssh"
    Available = {"ssh"}
    AllowFallback = FALSE
    AllowUnavailable = FALSE
INVARIANTS
    TypeOK
    RunsOnlyUnderTheConfiguredBackend
    UnavailableBackendNeverRuns
