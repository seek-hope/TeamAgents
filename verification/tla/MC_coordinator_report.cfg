\* Negative control (A33): a restart that lands in the fork window reports a
\* coordinator that is not really there instead of waiting for exec. TLC must
\* report `TheWindowIsNotMistakenForAHolder` violated — the defect
\* `a_momentarily_held_lock_is_absorbed` exists for.
SPECIFICATION Spec
CONSTANTS
    ReportInsteadOfWaiting = TRUE
    ChildKeepsLock = FALSE
    NotExclusive = FALSE
INVARIANTS
    TypeOK
    AtMostOneCoordinator
    TheWindowIsNotMistakenForAHolder
    NoHeldLockWithoutAHolder
PROPERTIES
    RecoveryIsLive
