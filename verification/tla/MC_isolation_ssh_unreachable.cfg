\* Negative control (D-437): the configured backend is not usable here — the sshd is down or the key is refused —
\* and a command runs anyway. TLC must refute `UnavailableBackendNeverRuns`; the probe shows the same shape live
\* by stopping the sshd and checking that nothing runs locally.
SPECIFICATION Spec
CONSTANTS
    Backends = {"bubblewrap", "docker", "ssh", "host"}
    Configured = "ssh"
    Available = {}
    AllowFallback = FALSE
    AllowUnavailable = TRUE
INVARIANTS
    TypeOK
    UnavailableBackendNeverRuns
