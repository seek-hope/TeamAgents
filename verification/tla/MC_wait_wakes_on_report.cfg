\* Negative control (D-255(b), decided by D-341/D-348): a runtime that treats a reported `BLOCKED` as a
\* settlement of the delegated task. It is a *report* — the assignee may still be unblocked and settle the same
\* task later — so it wakes nobody and the wait stays pending (DESIGN §5.3).
\* TLC must report `ReportsAreNotSettlements` violated; MC_wait.cfg is the same configuration with
\* `WakeOnReport = FALSE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Waits = {"w1", "w2"}
    Conds = {"c1", "c2"}
    Instances = {"L", "M"}
    TaskSettled = "c1"
    MessageCond = "c2"
    WidenMessageToTaskResults = FALSE
    WakeOnReport = TRUE
    WakeOnIdle = FALSE
    CloseWithoutAnswer = FALSE
INVARIANTS
    TypeOK
    SatisfiedHoldsConditions
PROPERTIES
    ReportsAreNotSettlements
