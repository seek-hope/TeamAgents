\* Negative control (D-392): the build step expands an image reference without consulting the model's declared
\* capability, and the model never declared it — so a real image part is handed to a model that cannot read one.
\* TLC must report `NoImagesWithoutSupport` violated; with `BlindSendsParts = FALSE` the same property verifies
\* (MC_images.cfg for a vision model, MC_images_blind_model.cfg for a blind one).
SPECIFICATION Spec
CONSTANTS
    Vision = FALSE
    BlindSendsParts = TRUE
INVARIANTS
    TypeOK
    NoImagesWithoutSupport
