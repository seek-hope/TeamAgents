\* Negative control (D-64): a runtime that ignores the goal's deadline — the gate
\* `begin_request` applies (A35) with the configured ceiling removed. Past the
\* deadline it keeps starting new requests, which is what a session with a
\* configured `deadline_minutes` promises not to do.
\* TLC must report `NoRequestAfterDeadline` violated; MC.cfg is the same
\* configuration with `IgnoreDeadline = FALSE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Instances = {"L"}
    Ops = {"o1"}
    ReqIds = {1, 2}
    AttIds = {1}
    ApprovalOps = {"o1"}
    TokenLimit = 2
    MaxEpoch = 1
    MaxUnknown = 1
    AllowMidTurnInput = FALSE
    ReaskAfterReply = FALSE
    RuntimeTailIsWork = FALSE
    IgnoreDeadline = TRUE
    ReleaseOnCancel = TRUE
    PerInstanceFairness = TRUE
INVARIANTS
    TypeOK
    NoEffectBeforeApproval
    ReservationsAdmitted
PROPERTIES
    NoRequestAfterDeadline
