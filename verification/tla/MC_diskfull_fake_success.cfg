\* Negative control (A31): a step whose write failed is recorded as a success.
\* TLC must report `NoFakedSuccess` violated — the failure becomes a lie.
SPECIFICATION Spec
CONSTANTS
    KeepDriving = FALSE
    FakeSuccess = TRUE
    ParkSilently = FALSE
    ClearAnyway = FALSE
INVARIANTS
    TypeOK
    NoStepRunsWhileLatched
    NoFakedSuccess
    LossIsReported
    LatchClearsOnlyWhenWritable
PROPERTIES
    ParkEventuallyLands
