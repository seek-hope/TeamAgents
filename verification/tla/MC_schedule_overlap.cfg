\* Negative control (D-367): a run starts while one is already in flight, so an automation overlaps itself.
\* TLC must refute `AtMostOneRunPerAutomation`.
SPECIFICATION Spec
CONSTANTS
    Automations = {"a1", "a2"}
    MaxTime = 3
    AllowDuplicate = FALSE
    AllowOverlap = TRUE
    AllowDisabled = FALSE
    AllowEarly = FALSE
INVARIANTS
    TypeOK
    NoDuplicateRun
    AtMostOneRunPerAutomation
    DisabledNeverRuns
    OnlyDueSlotsRun
