\* expects: GcClaimsOnlyUnreferencedLive
\* Negative control (D-220): the collector never reads the reference table, so an artifact other messages still
\* point at is claimed and deleted — the mistake `GcClaimsOnlyUnreferencedLive` exists to catch. TLC must report
\* that invariant violated; the same configuration with `GcIgnoresHolders = FALSE` (MC_artifact.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Artifacts = {"a1", "a2", "a3"}
    Owners = {"r1", "r2"}
    \* Each guard gets a session of its own, so neither counterfactual is masked by the other — the lesson the
    \* Prune configurations learned first (D-435) and this one had to learn again: `a1` is spent *and* aged (the
    \* legitimate release), `a2` is aged but its owner is still live, `a3` is spent but inside the window.
    Spent = {"a1", "a3"}
    Aged = {"a1", "a2"}
    GcIgnoresHolders = TRUE
    ReleaseLiveOwner = FALSE
    ReleaseFreshArtifact = FALSE
    ReferenceUnpersisted = FALSE
    ReleaseDeletesBytes = FALSE
    CollectorKeepsGhost = FALSE
    ReferenceToStaging = FALSE
    DeleteAnyone = FALSE
    ClaimAnyone = FALSE
    LiveWithoutReference = FALSE
INVARIANTS
    TypeOK
    GcClaimsOnlyUnreferencedLive
