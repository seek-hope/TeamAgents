\* Negative control (D-220): the collector never reads the reference table, so an
\* artifact other messages still point at is claimed and deleted — the mistake
\* `GcClaimsOnlyUnreferencedLive` exists to catch. TLC must report that invariant
\* violated; the same configuration with `GcIgnoresHolders = FALSE`
\* (MC_artifact.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Artifacts = {"a1", "a2"}
    Owners = {"r1", "r2"}
    GcIgnoresHolders = TRUE
INVARIANTS
    TypeOK
    GcClaimsOnlyUnreferencedLive
