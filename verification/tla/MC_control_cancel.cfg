\* expects: CancelledWorkReleasesParkedInstances
\* Negative control (D-341/D-344): a runtime that closes a work nothing can spend and leaves the instance its
\* refusal parked where the refusal put it — the dead end A18's known gap describes, where the user's only way
\* out was to abandon the session. Nothing else changes, so the refutation is exactly this.
\* TLC must report `CancelledWorkReleasesParkedInstances` violated; MC.cfg is the same configuration with
\* `ReleaseOnCancel = TRUE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Instances = {"L"}
    Ops = {"o1"}
    ReqIds = {1, 2}
    AttIds = {1}
    ApprovalOps = {"o1"}
    TokenLimit = 2
    MaxEpoch = 1
    MaxUnknown = 1
    WarnLate = FALSE
    WarnRepeatedly = FALSE
    MaxWarns = 2
    AllowMidTurnInput = FALSE
    ReaskAfterReply = FALSE
    RuntimeTailIsWork = FALSE
    IgnoreDeadline = FALSE
    ReleaseOnCancel = FALSE
    PerInstanceFairness = TRUE
    BadAdmission = FALSE
    BadActiveRequest = FALSE
    EffectBeforeDispatch = FALSE
    KeepClosedReservation = FALSE
    OverReserve = FALSE
    SelectIncomplete = FALSE
    DoubleEffect = FALSE
    RewriteTerminalOp = FALSE
    RewriteTerminalWork = FALSE
    CrossEpochReceipt = FALSE
    EffectUnauthorized = FALSE
    EffectAfterCancel = FALSE
    PreparedEffect = FALSE
    StaleExecutor = FALSE
    EffectOnTerminated = FALSE
INVARIANTS
    TypeOK
    NoEffectBeforeApproval
    RecordBeforeEffect
    EffectAtMostOnce
    ReservationsAdmitted
    ReservationReleased
    OneActiveRequest
    SelectionIsComplete
    NoTurnWithoutWork
    SettlementFollowsATurnAfterTheLanding
    StaleExecutorRejected
    PreparedIsNotTerminal
    CancelledBeforeStartHasNoEffect
    InputLandsAtTheBoundary
PROPERTIES
    NoDispatchOnTerminated
    CancelledWorkReleasesParkedInstances
