\* Negative control (D-341/D-344): a runtime that closes a goal nothing can spend and leaves the instance its
\* refusal parked where the refusal put it — the dead end A18's known gap describes, where the user's only way
\* out was to abandon the session. Nothing else changes, so the refutation is exactly this.
\* TLC must report `CancelledGoalReleasesParkedInstances` violated; MC.cfg is the same configuration with
\* `ReleaseOnCancel = TRUE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Instances = {"L"}
    Ops = {"o1"}
    ReqIds = {1, 2}
    AttIds = {1}
    ApprovalOps = {"o1"}
    TokenLimit = 2
    MaxEpoch = 1
    MaxUnknown = 1
    AllowMidTurnInput = FALSE
    ReaskAfterReply = FALSE
    RuntimeTailIsWork = FALSE
    IgnoreDeadline = FALSE
    ReleaseOnCancel = FALSE
    PerInstanceFairness = TRUE
INVARIANTS
    TypeOK
    NoEffectBeforeApproval
    RecordBeforeEffect
    EffectAtMostOnce
    ReservationsAdmitted
    ReservationReleased
    OneActiveRequest
    SelectionIsComplete
    NoTurnWithoutWork
    SettlementFollowsATurnAfterTheLanding
    StaleExecutorRejected
    NoEffectOnTerminated
    PreparedIsNotTerminal
    CancelledBeforeStartHasNoEffect
    InputLandsAtTheBoundary
PROPERTIES
    CancelledGoalReleasesParkedInstances
