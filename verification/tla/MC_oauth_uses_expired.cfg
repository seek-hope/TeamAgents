\* Negative control (D-412): the client keeps presenting an expired token instead of refreshing it or
\* asking the user to sign in again. TLC must report `NoRequestWithAnExpiredToken` violated; MC_oauth.cfg is
\* the same configuration with `IgnoreExpiry = FALSE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Services = {"s1"}
    Resources = {"r1", "r2"}
    Codes = {"c1", "c2"}
    Tokens = {"t1", "t2"}
    Refreshable = {"s1"}
    MaxLife = 3
    MaxClock = 6
    IgnoreResource = FALSE
    ReuseCode = FALSE
    LeakVerifier = FALSE
    IgnoreExpiry = TRUE
    IgnoreLogout = FALSE
INVARIANTS
    TypeOK
    NoRequestWithAnExpiredToken
