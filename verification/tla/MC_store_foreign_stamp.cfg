\* expects: NoForeignStamp
\* Negative control (D-462): a file with another program's tables receives our stamp.
SPECIFICATION Spec
CONSTANTS
    OurTables = {"meta", "goals", "events"}
    ForeignTables = {"users"}
    IgnoreForeign = TRUE
    RefusalWrites = FALSE
    AcceptUnstamped = FALSE
    InterruptWithForeign = FALSE
    StrandInterrupted = FALSE
INVARIANTS
    NoForeignStamp
