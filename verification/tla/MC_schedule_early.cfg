\* Negative control (D-367): a run starts before its slot is due.
\* TLC must refute `OnlyDueSlotsRun`.
SPECIFICATION Spec
CONSTANTS
    Automations = {"a1", "a2"}
    MaxTime = 3
    AllowDuplicate = FALSE
    AllowOverlap = FALSE
    AllowDisabled = FALSE
    AllowEarly = TRUE
INVARIANTS
    TypeOK
    NoDuplicateRun
    AtMostOneRunPerAutomation
    DisabledNeverRuns
    OnlyDueSlotsRun
