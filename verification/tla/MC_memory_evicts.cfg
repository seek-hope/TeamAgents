\* Negative control (D-405): at the cap the store drops its oldest note to make room. TLC must report
\* `NotesAreAppendOnly` violated; with `Evicts = FALSE` (MC_memory.cfg) the same property verifies — which is what
\* makes "refuse at the cap" a rule rather than an implementation accident.
SPECIFICATION Spec
CONSTANTS
    MaxNotes = 3
    RecallMax = 2
    Evicts = TRUE
INVARIANTS
    TypeOK
    NotesAreAppendOnly
