\* expects: RevokedStaysRevoked
\* Negative control (D-462): revocation records the id and leaves the grant live.
SPECIFICATION Spec
CONSTANTS
    Instances = {"leader", "child"}
    Actions = {"shell", "manage", "delegate", "message"}
    GrantIds = {"g1", "g2", "g3", "g4", "g5"}
    BaseTools = {"files"}
    OfferedLagsRevocation = FALSE
    EffectTwice = FALSE
    DispatchWithStaleStamp = FALSE
    MintBeyondParent = FALSE
    AuthorityFromRuntime = FALSE
    RevokeLeavesGrantsLive = TRUE
    CascadeKeepsSiblings = FALSE
    InstanceMintsDelegable = FALSE
    TaskChildDelegable = FALSE
    TaskChildWithoutParent = FALSE
    BootstrappedWithExtra = FALSE
    MintTaskChildren = FALSE
    EffectWithoutAuthority = FALSE
INVARIANTS
    RevokedStaysRevoked
