\* expects: InputLandsAtTheBoundary
\* Negative control (D-63): the driver applies user input while a request is in
\* flight — what the code did before D-63. The input lands behind the running
\* turn's context, that turn's own reply lands after it, and the idle rule then
\* gives the input no turn: the user's message silently did nothing.
\* TLC must report `InputLandsAtTheBoundary` violated; the same configuration with
\* `AllowMidTurnInput = FALSE` (MC.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Instances = {"L"}
    Ops = {"o1"}
    ReqIds = {1, 2}
    AttIds = {1}
    ApprovalOps = {"o1"}
    TokenLimit = 2
    MaxEpoch = 1
    MaxUnknown = 1
    WarnLate = FALSE
    WarnRepeatedly = FALSE
    MaxWarns = 2
    AllowMidTurnInput = TRUE
    ReaskAfterReply = FALSE
    RuntimeTailIsWork = FALSE
    IgnoreDeadline = FALSE
    ReleaseOnCancel = TRUE
    PerInstanceFairness = TRUE
    BadAdmission = FALSE
    BadActiveRequest = FALSE
    EffectBeforeDispatch = FALSE
    KeepClosedReservation = FALSE
    OverReserve = FALSE
    SelectIncomplete = FALSE
    DoubleEffect = FALSE
    RewriteTerminalOp = FALSE
    RewriteTerminalGoal = FALSE
    CrossEpochReceipt = FALSE
    EffectUnauthorized = FALSE
    EffectAfterCancel = FALSE
    PreparedEffect = FALSE
    StaleExecutor = FALSE
    EffectOnTerminated = FALSE
INVARIANTS
    TypeOK
    NoEffectBeforeApproval
    RecordBeforeEffect
    EffectAtMostOnce
    ReservationsAdmitted
    ReservationReleased
    OneActiveRequest
    SelectionIsComplete
    NoTurnWithoutWork
    StaleExecutorRejected
    NoEffectOnTerminated
    PreparedIsNotTerminal
    CancelledBeforeStartHasNoEffect
    InputLandsAtTheBoundary
