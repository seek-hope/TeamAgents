\* Negative control (D-218): terminating an instance leaves its open tasks open —
\* the user's cascade dropped, so a dead assignee still holds work the team will
\* never finish. TLC must report `NoOpenTaskOnDeadAssignee` violated; the same
\* configuration with `LeaveTasksOnTerminate = FALSE` (MC_task.cfg,
\* MC_task_two.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Tasks = {"t1"}
    Instances = {"L", "W"}
    Goals = {"g1", "g2"}
    MaxOps = 1
    DelegateToSettledGoal = FALSE
    BillSettledGoal = FALSE
    AllowUnorderedDependency = FALSE
    LeaveTasksOnTerminate = TRUE
INVARIANTS
    TypeOK
    SystemOnlyParksTasks
    OnlyPartiesWriteTasks
    ReturnPathOnlyWhileOpen
    DependenciesPointBackwards
    NoSelfDependency
    NoOpenTaskOnDeadAssignee
    SettledIsFinal
    NoStaleActiveGoal
    RegisteredWorkNeedsAnActiveGoal
    RequestsResolveToActiveGoals
