\* Negative control (D-219): a compaction drops the oldest event and renumbers the
\* log, so a version number is reused — what the claim "versions are never reused
\* or rolled back" forbids. TLC must report `LogMonotone` violated (the `shrank`
\* monitor is written for the first time); the same configuration with
\* `RollbackLog = FALSE` (MC_daemon.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Clients = {"c1", "c2"}
    Commands = {"x1", "x2"}
    Versions = {1, 2}
    MaxLog = 3
    ReplayRewritesReceipt = FALSE
    RollbackLog = TRUE
    ReclaimEvents = FALSE
INVARIANTS
    TypeOK
    LogMonotone
