\* Negative control (D-437): a lost ssh connection falls back to a local backend — the failure that would turn
\* `sandbox = "ssh"` into a host shell the moment the network hiccups. TLC must refute
\* `RunsOnlyUnderTheConfiguredBackend`.
SPECIFICATION Spec
CONSTANTS
    Backends = {"bubblewrap", "docker", "ssh", "host"}
    Configured = "ssh"
    Available = {"ssh", "bubblewrap", "host"}
    AllowFallback = TRUE
    AllowUnavailable = FALSE
INVARIANTS
    TypeOK
    RunsOnlyUnderTheConfiguredBackend
