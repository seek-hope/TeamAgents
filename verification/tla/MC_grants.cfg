\* Small authority model: the four bootstrap grants plus one free slot (the
\* spawn-derived delegate grant, or a grant the user issues), both instances, and
\* the two operations that matter — the leader's delegation (which the bootstrap
\* authority must make possible) and a spawned child's shell call (which it must
\* never make possible).
SPECIFICATION Spec
CONSTANTS
    Instances = {"leader", "child"}
    Actions = {"shell", "manage", "delegate", "message"}
    GrantIds = {"g1", "g2", "g3", "g4", "g5"}
    BaseTools = {"files"}
    OfferedLagsRevocation = FALSE
    EffectTwice = FALSE
    DispatchWithStaleStamp = FALSE
    MintBeyondParent = FALSE
    AuthorityFromRuntime = FALSE
    RevokeLeavesGrantsLive = FALSE
    CascadeKeepsSiblings = FALSE
    InstanceMintsDelegable = FALSE
    TaskChildDelegable = FALSE
    TaskChildWithoutParent = FALSE
    BootstrappedWithExtra = FALSE
    MintTaskChildren = FALSE
    EffectWithoutAuthority = FALSE
INVARIANTS
    TypeOK
    TypeOKGrants
    TypeOKRevision
    TypeOKOffered
    TypeOKOps
    EffectAtMostOnce
    OnceStaleNeverExecutes
    ChildGrantsAreCoveredByTheirParent
    AuthorityTracesToTheUser
    RevokedStaysRevoked
    CascadeTakesTheSubtree
    OfferedToolsAreAuthorized
    BootstrappedAuthority
    DelegableGrantsAreUserIssued
    TaskScopedGrantsAreNonDelegable
    TaskScopedGrantsHaveParents
PROPERTIES
    AuthorizedEffectsOnly
