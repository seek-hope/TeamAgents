\* The second task (D-218): the same rules with two task slots, so the two
\* dependency invariants are no longer vacuous — with one task a prerequisite can
\* only be the empty set, so `DependenciesPointBackwards` and `NoSelfDependency`
\* hold for want of anything to check. One instance and one work keep it inside a
\* bounded exhaustive run (ten seconds); the two-instance two-work product is
\* beyond a bounded attempt (verification/README.md measures it), and the
\* simulation supplement searches that shape instead.
SPECIFICATION Spec
CONSTANTS
    Tasks = {"t1", "t2"}
    Instances = {"L"}
    Works = {"g1"}
    MaxOps = 1
    DelegateToSettledWork = FALSE
    BillSettledWork = FALSE
    AllowUnorderedDependency = FALSE
    LeaveTasksOnTerminate = FALSE
    StrangerWrites = FALSE
    ReturnPathClosed = FALSE
    RewriteSettled = FALSE
    SystemSettles = FALSE
    SelfDependency = FALSE
    StaleActiveWork = FALSE
INVARIANTS
    TypeOK
    SystemOnlyParksTasks
    OnlyPartiesWriteTasks
    ReturnPathOnlyWhileOpen
    DependenciesPointBackwards
    NoSelfDependency
    NoOpenTaskOnDeadAssignee
    SettledIsFinal
    NoStaleActiveWork
    RegisteredWorkNeedsAnActiveWork
    RequestsResolveToActiveWorks
