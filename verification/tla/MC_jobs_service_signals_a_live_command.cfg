\* Negative control (D-251): the service stop signals the group of a command that is *not* settled — the
\* live partner of §6.2/§6.3 taken away by a cleanup verb. TLC must report `NoLiveCommandWasSignalled` violated
\* (the `liveService` monitor is written for the first time); the same configuration with
\* `SignalWithoutChecking = FALSE` (MC_jobs.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    GuessNotRun = FALSE
    DoubleGo = FALSE
    LateGoStarts = FALSE
    SpawnBeforeAccept = FALSE
    RetireWithAChild = FALSE
    SignalWithoutChecking = TRUE
INVARIANTS
    TypeOK
    NoLiveCommandWasSignalled
