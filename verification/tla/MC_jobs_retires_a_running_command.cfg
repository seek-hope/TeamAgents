\* Negative control (D-250): the `runners` lever retires a runner whose command is in flight — the listing tool
\* that takes work away, which is the one thing the verb must never do. TLC must report
\* `NothingInFlightWasRetired` violated (the monitor is written for the first time); the same configuration with
\* `RetireWithAChild = FALSE` (MC_jobs.cfg) verifies. The rule the control breaks is not a promise the lever
\* makes: it is the runner's own gate (`active command must stop before shutdown`), which is why the model puts
\* the guard on the retire step.
SPECIFICATION Spec
CONSTANTS
    GuessNotRun = FALSE
    DoubleGo = FALSE
    LateGoStarts = FALSE
    SpawnBeforeAccept = FALSE
    RetireWithAChild = TRUE
    SignalWithoutChecking = FALSE
INVARIANTS
    TypeOK
    NothingInFlightWasRetired
