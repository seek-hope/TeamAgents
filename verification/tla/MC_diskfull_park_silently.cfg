\* Negative control (A31): the park lands without naming the in-flight persistence
\* loss. TLC must report `LossIsReported` violated — the reason is what tells the user
\* that a result was lost rather than settled.
SPECIFICATION Spec
CONSTANTS
    KeepDriving = FALSE
    FakeSuccess = FALSE
    ParkSilently = TRUE
    ClearAnyway = FALSE
INVARIANTS
    TypeOK
    NoStepRunsWhileLatched
    NoFakedSuccess
    LossIsReported
    LatchClearsOnlyWhenWritable
PROPERTIES
    ParkEventuallyLands
