\* Negative control (D-220): the revoke path computes the offered surface from
\* the grant table as it was *before* the revocation, so a model is still shown
\* `shell` after the grant that covered it went away. TLC must report
\* `OfferedToolsAreAuthorized` violated; the same configuration with
\* `OfferedLagsRevocation = FALSE` (MC_grants.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Instances = {"leader", "child"}
    Actions = {"shell", "manage", "delegate", "message"}
    GrantIds = {"g1", "g2", "g3", "g4", "g5"}
    BaseTools = {"files"}
    OfferedLagsRevocation = TRUE
INVARIANTS
    TypeOK
    OfferedToolsAreAuthorized
