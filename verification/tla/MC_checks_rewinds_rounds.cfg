\* Negative control (D-219): opening a repair round resets the round counter instead of advancing it, so the budget
\* can never run out. TLC must report `RoundsAreMonotone` violated.
SPECIFICATION Spec
CONSTANTS
    AllChecks = {"k1", "k2"}
    Independent = FALSE
    SelfVerified = FALSE
    RewindRounds = TRUE
    LateRequire = FALSE
    MaxRounds = 2
INVARIANTS
    TypeOK
    RoundsAreMonotone
