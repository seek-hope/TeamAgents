\* Negative control (D-219): opening a repair round resets the round counter
\* instead of advancing it, so the budget can never run out — the claim "the round
\* counter never goes backwards" is about exactly that. TLC must report
\* `RoundsAreMonotone` violated (the `rewound` monitor is written for the first
\* time); the same configuration with `RewindRounds = FALSE` (MC_checks.cfg)
\* verifies.
SPECIFICATION Spec
CONSTANTS
    AllChecks = {"k1", "k2"}
    MaxRounds = 2
    RewindRounds = TRUE
    LateRequire = FALSE
INVARIANTS
    TypeOK
    RoundsAreMonotone
