\* Negative control (D-257's third question, decided by D-341/D-348): a runtime that wakes a delegator because
\* its task's assignee has gone idle. There is no automatic wake: an assignee that ends its turn without
\* settling leaves its task open, and the delegator's own timer plus `cancel_task` (D-265) is the mechanism
\* (DESIGN §5.3).
\* TLC must report `IdleIsNotASettlement` violated; MC_wait.cfg is the same configuration with
\* `WakeOnIdle = FALSE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Waits = {"w1", "w2"}
    Conds = {"c1", "c2"}
    Instances = {"L", "M"}
    TaskSettled = "c1"
    MessageCond = "c2"
    WidenMessageToTaskResults = FALSE
    WakeOnReport = FALSE
    WakeOnIdle = TRUE
    CloseWithoutAnswer = FALSE
INVARIANTS
    TypeOK
    SatisfiedHoldsConditions
PROPERTIES
    IdleIsNotASettlement
