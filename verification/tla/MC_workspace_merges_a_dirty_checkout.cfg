\* Negative control (D-252): the merge carries the branch out although the checkout still holds uncommitted
\* changes — work the merge would leave behind, which is what the workspace module refuses to do silently (and
\* what a bare `git merge` driven by a listing tool would do). TLC must report `UncommittedWorkIsNeverMerged`
\* violated (the `mergedDirty` monitor is written for the first time); the same configuration with
\* `MergeWithoutChecking = FALSE` (MC_workspace.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    MergeWithoutChecking = TRUE
    RetireBuryingWork = FALSE
INVARIANTS
    TypeOK
    UncommittedWorkIsNeverMerged
