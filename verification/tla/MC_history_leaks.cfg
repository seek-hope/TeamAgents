\* Negative control (A05): an instance is allowed to read another instance's
\* private history. TLC must refute `InstancesReadOnlyTheirOwn`.
SPECIFICATION Spec
CONSTANTS
    Instances = {"i1", "i2"}
    AllowForeign = TRUE
    AllowSystem = FALSE
INVARIANTS
    TypeOK
    InstancesReadOnlyTheirOwn
    SystemNeverReads
