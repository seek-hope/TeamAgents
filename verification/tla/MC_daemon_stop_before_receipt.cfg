\* Negative control (D-248): the accept loop leaves with a stop request still unanswered — a stop that answers
\* its client nothing, so the client has a broken connection instead of a receipt. TLC must report
\* `StopsOnlyAfterAnswering` violated; the same configuration with `StopBeforeReceipt = FALSE`
\* (MC_daemon_stop.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Clients = {"c1", "c2"}
    Commands = {"x1", "x2"}
    Versions = {1, 2}
    MaxLog = 3
    ReplayRewritesReceipt = FALSE
    RollbackLog = FALSE
    ReclaimEvents = FALSE
    StopBeforeReceipt = TRUE
    KeepServingAfterReceipt = FALSE
INVARIANTS
    TypeOK
    StopsOnlyAfterAnswering
