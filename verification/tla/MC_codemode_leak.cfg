\* Negative control (D-374): a script pushes its nested payloads into the model's
\* context too. TLC must refute `OnlyScriptOutputEnters`; a config that verifies
\* would mean the property says nothing.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Tools = {"t1", "t2"}
    LeakNested = TRUE
INVARIANTS
    TypeOK
    OnlyScriptOutputEnters
    ScriptsAlwaysEmit
