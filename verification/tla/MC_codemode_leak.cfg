\* Negative control (D-374): a script pushes its nested payloads into the model's
\* context too. TLC must refute `OnlyScriptOutputEnters`.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Tools = {"t1", "t2"}
    Vetoed = {"t1"}
    IgnoreVeto = FALSE
    LeakNested = TRUE
INVARIANTS
    TypeOK
    OnlyScriptOutputEnters
    ScriptsAlwaysEmit
    VetoedNeverCalled
