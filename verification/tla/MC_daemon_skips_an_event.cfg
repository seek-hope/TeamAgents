\* Negative control (D-249): a batch hands over the log minus one event — a gap, which is the one thing
\* `events(since)` promises never to serve. The batch counts honestly (so no other claim is disturbed) and TLC
\* must report `HandoversAreTheFullRange` violated: what it added is not the whole range after the client's
\* watermark. The same configuration with `SkipAnEvent = FALSE` (MC_daemon.cfg) verifies. Before this control
\* the gap-freeness the README claimed was a property of the model's arithmetic — no step could hand over
\* anything but the contiguous range.
SPECIFICATION Spec
CONSTANTS
    Clients = {"c1", "c2"}
    Commands = {"x1", "x2"}
    Versions = {1, 2}
    MaxLog = 3
    ReplayRewritesReceipt = FALSE
    RollbackLog = FALSE
    ReclaimEvents = FALSE
    StopBeforeReceipt = FALSE
    KeepServingAfterReceipt = FALSE
    SkipAnEvent = TRUE
    DeliverTwice = FALSE
INVARIANTS
    TypeOK
    NothingIsServedTwice
PROPERTIES
    HandoversAreTheFullRange
