\* Negative control (D-248): the daemon answers the stop and then keeps serving — the shape the lever had while
\* its first wiring left the process in its signal wait with the socket already gone (measured 2026-09-27). The
\* safety half still holds; the *liveness* claim does not, and TLC must report
\* `AStopIsAnsweredAndEndsTheSession` violated. The same configuration with `KeepServingAfterReceipt = FALSE`
\* (MC_daemon_stop.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Clients = {"c1", "c2"}
    Commands = {"x1", "x2"}
    Versions = {1, 2}
    MaxLog = 3
    ReplayRewritesReceipt = FALSE
    RollbackLog = FALSE
    ReclaimEvents = FALSE
    StopBeforeReceipt = FALSE
    KeepServingAfterReceipt = TRUE
PROPERTIES
    AStopIsAnsweredAndEndsTheSession
