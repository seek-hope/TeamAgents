\* Negative control (§6.2): the command is spawned before its acceptance is
\* persisted, so a run can be invisible to recovery. TLC must report
\* `NoEffectBeforeAccept` violated (and, after a crash in that state,
\* `NotRunMeansNoEffect`: the journal proves nothing yet the verdict says "did not
\* run" while the effect happened).
SPECIFICATION Spec
CONSTANTS
    GuessNotRun = FALSE
    DoubleGo = FALSE
    LateGoStarts = FALSE
    SpawnBeforeAccept = TRUE
    RetireWithAChild = FALSE
    SignalWithoutChecking = FALSE
INVARIANTS
    TypeOK
    AtMostOneExecutor
    LateGoIsRejected
    UnverifiableStartIsNeverGuessedNotRun
    NotRunMeansNoEffect
    NoEffectBeforeAccept
    EffectImpliesAcceptedStart
PROPERTIES
    SettledRunnerLeaves
