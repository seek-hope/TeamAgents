\* Negative control (D-61): the grant view without the `id` field — the state of the
\* daemon before D-61, when the SELECT list carried subject/action/scope/revoked
\* and no id. Nothing else changes, so the refutation is exactly this.
\* TLC must report `EveryLiveGrantBecomesRevocable` violated (no client can name a
\* grant, so none can be revoked); the same run must leave every invariant green.
SPECIFICATION Spec
CONSTANTS
    Instances = {"leader", "worker"}
    Actions = {"shell", "manage", "delegate", "message", "task_result"}
    GrantIds = {"g1", "g2", "g3", "g4"}
    BaseTools = {"files"}
    ViewFields = {"issuer", "subject", "action", "scope", "revoked"}
    Granter = "user"
    TrustSurface = FALSE
    RefreshSurface = TRUE
INVARIANTS
    TypeOK
    NoDeadGrantPair
    ListedIdsAreUsed
    AuthorityTracesToTheUser
    RevokedStaysRevoked
    ChildGrantsAreCoveredByTheirParent
    CascadeTakesTheSubtree
    EffectAtMostOnce
    OnceStaleNeverExecutes
    BootstrappedAuthority
PROPERTIES
    EveryLiveGrantBecomesRevocable
