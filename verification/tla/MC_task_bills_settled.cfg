\* expects: RequestsResolveToActiveWorks
\* Negative control (D-218): a request bills a work that has already settled — the
\* `budget_work` fallback without its ACTIVE gate, which would charge usage to a
\* work the daemon has detached from every instance. TLC must report
\* `RequestsResolveToActiveWorks` violated (the request resolves to the settled
\* work of the oldest open task, which is the `lateRequest` the monitor records);
\* the same configuration with `BillSettledWork = FALSE` (MC_task.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Tasks = {"t1"}
    Instances = {"L", "W"}
    Works = {"g1", "g2"}
    MaxOps = 1
    DelegateToSettledWork = FALSE
    BillSettledWork = TRUE
    AllowUnorderedDependency = FALSE
    LeaveTasksOnTerminate = FALSE
    StrangerWrites = FALSE
    ReturnPathClosed = FALSE
    RewriteSettled = FALSE
    SystemSettles = FALSE
    SelfDependency = FALSE
    StaleActiveWork = FALSE
INVARIANTS
    TypeOK
    SystemOnlyParksTasks
    OnlyPartiesWriteTasks
    ReturnPathOnlyWhileOpen
    DependenciesPointBackwards
    NoSelfDependency
    NoOpenTaskOnDeadAssignee
    SettledIsFinal
    NoStaleActiveWork
    RegisteredWorkNeedsAnActiveWork
    RequestsResolveToActiveWorks
