\* Negative control (D-218): a request bills a goal that has already settled — the
\* `budget_goal` fallback without its ACTIVE gate, which would charge usage to a
\* goal the daemon has detached from every instance. TLC must report
\* `RequestsResolveToActiveGoals` violated (the request resolves to the settled
\* goal of the oldest open task, which is the `lateRequest` the monitor records);
\* the same configuration with `BillSettledGoal = FALSE` (MC_task.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Tasks = {"t1"}
    Instances = {"L", "W"}
    Goals = {"g1", "g2"}
    MaxOps = 1
    DelegateToSettledGoal = FALSE
    BillSettledGoal = TRUE
    AllowUnorderedDependency = FALSE
    LeaveTasksOnTerminate = FALSE
INVARIANTS
    TypeOK
    SystemOnlyParksTasks
    OnlyPartiesWriteTasks
    ReturnPathOnlyWhileOpen
    DependenciesPointBackwards
    NoSelfDependency
    NoOpenTaskOnDeadAssignee
    SettledIsFinal
    NoStaleActiveGoal
    RegisteredWorkNeedsAnActiveGoal
    RequestsResolveToActiveGoals
