\* The sandbox backend choice, as designed (D-369): a command runs under the configured backend and only under
\* one the probe accepted — never a silent fallback, never an unusable backend.
SPECIFICATION Spec
CONSTANTS
    Backends = {"bubblewrap", "docker", "host"}
    Configured = "docker"
    Available = {"docker", "bubblewrap"}
    AllowFallback = FALSE
    AllowUnavailable = FALSE
INVARIANTS
    TypeOK
    RunsOnlyUnderTheConfiguredBackend
    UnavailableBackendNeverRuns
