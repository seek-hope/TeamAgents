\* Negative control (D-376): the pre_tool veto is not applied to nested calls, so a
\* script reaches a tool the user denied. TLC must refute `VetoedNeverCalled`.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Tools = {"t1", "t2"}
    Vetoed = {"t1"}
    IgnoreVeto = TRUE
    LeakNested = FALSE
INVARIANTS
    TypeOK
    OnlyScriptOutputEnters
    ScriptsAlwaysEmit
    VetoedNeverCalled
