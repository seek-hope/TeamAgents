\* Negative control (§5.3): a full inbox makes room by discarding what is queued
\* instead of refusing the send. TLC must report `NoSilentLoss` violated — an id
\* that was accepted is free again, which is the silent drop the rule forbids.
SPECIFICATION Spec
CONSTANTS
    MaxInbox = 2
    ApplyWithoutDedup = FALSE
    DropWhenFull = TRUE
    OverflowInbox = FALSE
    ApplySealed = FALSE
    AnyInstanceDrains = FALSE
INVARIANTS
    TypeOK
    AtMostOncePerEnvelope
    LogIsIncreasing
    NoSilentLoss
    NoStaleApplication
    DrainIsOwned
    BoundedInbox
