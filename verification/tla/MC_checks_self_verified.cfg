\* expects: IndependenceIsNotSelfVerified
\* Negative control (D-393): a goal that requires independent verification accepts the *producing* instance's own
\* round. TLC must report `IndependenceIsNotSelfVerified` violated; with `SelfVerified = FALSE` the same property
\* verifies (MC_checks_independent.cfg).
SPECIFICATION Spec
CONSTANTS
    AllChecks = {"k1", "k2"}
    Independent = TRUE
    SelfVerified = TRUE
    RewindRounds = FALSE
    LateRequire = FALSE
    BriefWithoutChecks = FALSE
    MaxRounds = 2
    BriefTwice = FALSE
    RoundWithoutClaim = FALSE
    UpgradeCandidate = FALSE
    UnverifiedAccept = FALSE
    UnboundedRounds = FALSE
    BlockWithoutCause = FALSE
INVARIANTS
    TypeOK
    IndependenceIsNotSelfVerified
