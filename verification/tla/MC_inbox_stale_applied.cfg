\* expects: NoStaleApplication
\* Negative control (A24): an envelope queued before an epoch reset is applied
\* into the new epoch instead of being sealed. TLC must report
\* `NoStaleApplication` violated — the reset's guarantee is exactly that a
\* stale envelope never enters the new context.
\* This control lists only the claim it is shown to refute. Applying a stale
\* envelope also appends a duplicate id, so a configuration that also listed
\* `AtMostOncePerEnvelope` let TLC report whichever violation its search found
\* first: the same model reported `AtMostOncePerEnvelope` on CI and
\* `NoStaleApplication` locally. `MC_inbox_no_dedup.cfg` keeps that other
\* claim falsifiable.
SPECIFICATION Spec
CONSTANTS
    MaxInbox = 2
    ApplyWithoutDedup = FALSE
    AppendOutOfOrder = FALSE
    DropWhenFull = FALSE
    OverflowInbox = FALSE
    ApplySealed = TRUE
    AnyInstanceDrains = FALSE
INVARIANTS
    TypeOK
    NoStaleApplication
