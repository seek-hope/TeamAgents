\* Negative control (A24): an envelope queued before an epoch reset is applied
\* into the new epoch instead of being sealed. TLC must report
\* `NoStaleApplication` violated — the reset's guarantee is exactly that a
\* stale envelope never enters the new context.
SPECIFICATION Spec
CONSTANTS
    MaxInbox = 2
    ApplyWithoutDedup = FALSE
    DropWhenFull = FALSE
    OverflowInbox = FALSE
    ApplySealed = TRUE
    AnyInstanceDrains = FALSE
INVARIANTS
    TypeOK
    AtMostOncePerEnvelope
    LogIsIncreasing
    NoSilentLoss
    NoStaleApplication
    DrainIsOwned
    BoundedInbox
