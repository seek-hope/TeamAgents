\* Negative control (D-219): a same-payload replay re-applies the command and
\* moves its stored receipt — the client retry that duplicates the effect. TLC
\* must report `ReceiptsAreStable` violated (the `drift` monitor is written for
\* the first time); the same configuration with `ReplayRewritesReceipt = FALSE`
\* (MC_daemon.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Clients = {"c1", "c2"}
    Commands = {"x1", "x2"}
    Versions = {1, 2}
    MaxLog = 3
    ReplayRewritesReceipt = TRUE
    RollbackLog = FALSE
    ReclaimEvents = FALSE
    StopBeforeReceipt = FALSE
    KeepServingAfterReceipt = FALSE
INVARIANTS
    TypeOK
    ReceiptsAreStable
