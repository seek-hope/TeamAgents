\* Negative control (D-192): the sweep forgets the live-reference guard, so a
\* fact an open goal's receipts still point at is dropped. TLC must refute
\* `NoReferenceToEvictedFact` (and the step property with it).
SPECIFICATION Spec
CONSTANTS
    Facts = {"e1", "e2", "e3"}
    Live0 = {"e2"}
    Evidence0 = {"e3"}
    Horizon = 2
    MaxAge = 3
    IgnoreLive = TRUE
    IgnoreEvidence = FALSE
    IgnoreAge = FALSE
    IgnoreDisabled = FALSE
INVARIANTS
    TypeOK
    NoReferenceToEvictedFact
    EvidenceIsNeverEvicted
    OnlyOldFactsAreEvicted
PROPERTIES
    EvictionOnlyUnderTheGuards
