\* Negative control (D-192): the sweep runs although `history_days = 0` says the
\* full history is kept. TLC must refute `OnlyOldFactsAreEvicted`, which is what
\* states "retention switched on" as part of the rule.
SPECIFICATION Spec
CONSTANTS
    Facts = {"e1", "e2", "e3"}
    Live0 = {"e2"}
    Evidence0 = {"e3"}
    Horizon = 0
    MaxAge = 3
    IgnoreLive = FALSE
    IgnoreEvidence = FALSE
    IgnoreAge = FALSE
    IgnoreDisabled = TRUE
INVARIANTS
    TypeOK
    NoReferenceToEvictedFact
    EvidenceIsNeverEvicted
    OnlyOldFactsAreEvicted
PROPERTIES
    EvictionOnlyUnderTheGuards
