\* Negative control (D-87): `create = true` initializes whenever there is no
\* stamp, foreign tables or not — the store before D-87. TLC must report
\* `NoForeignAdoption` (and `NoForeignStamp`) violated: an unstamped database
\* that is someone else's gets the v2 schema and a vision of ours. The
\* `RefusalsWriteNothing` style claims are unaffected, which is the point —
\* that version refused nothing here at all.
SPECIFICATION Spec
CONSTANTS
    OurTables = {"meta", "goals", "events"}
    ForeignTables = {"users"}
    IgnoreForeign = TRUE
INVARIANTS
    TypeOK
    NoForeignAdoption
    NoForeignStamp
    RefusalsWriteNothing
    InterruptedWroteOursOnly
    AcceptedMeansStamped
PROPERTIES
    HalfInitializedIsCompleted
