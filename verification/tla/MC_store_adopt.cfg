\* expects: NoForeignAdoption
\* Negative control (D-87): `create = true` initializes whenever there is no
\* stamp, foreign tables or not — the store before D-87. TLC must report
\* `NoForeignAdoption` violated: an unstamped database that belongs to another
\* program receives the v2 schema and stamp.
\*
\* Check only that claim here. The old initializer also permits a crash after
\* the schema write; checking the crash invariant in this configuration made
\* the first reported violation depend on exploration order. The crash path
\* has its own `MC_store_interrupt_foreign` control, and the other claims stay
\* covered by `MC_store` and their dedicated controls.
SPECIFICATION Spec
CONSTANTS
    OurTables = {"meta", "goals", "events"}
    ForeignTables = {"users"}
    IgnoreForeign = TRUE
    RefusalWrites = FALSE
    AcceptUnstamped = FALSE
    InterruptWithForeign = FALSE
    StrandInterrupted = FALSE
INVARIANTS
    NoForeignAdoption
