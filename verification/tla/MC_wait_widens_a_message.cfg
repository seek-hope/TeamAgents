\* Negative control (D-255(a), decided by D-341/D-348): a runtime in which a delegated task's outcome *also*
\* satisfies a `{kind:'message'}` condition. The wait contract keeps the kinds apart — a task result is a
\* settlement, a message is a message (DESIGN §5.3) — so a delegator parked on a message must not be woken by
\* one, however tempting the reader's sense that "a result is a message" is.
\* TLC must report `MessageStaysAMessage` violated; MC_wait.cfg is the same configuration with
\* `WidenMessageToTaskResults = FALSE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Waits = {"w1", "w2"}
    Conds = {"c1", "c2"}
    Instances = {"L", "M"}
    TaskSettled = "c1"
    MessageCond = "c2"
    WidenMessageToTaskResults = TRUE
    WakeOnReport = FALSE
    WakeOnIdle = FALSE
    CloseWithoutAnswer = FALSE
INVARIANTS
    TypeOK
    SatisfiedHoldsConditions
PROPERTIES
    MessageStaysAMessage
