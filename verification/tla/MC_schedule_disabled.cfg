\* Negative control (D-367): a paused automation still runs.
\* TLC must refute `DisabledNeverRuns`.
SPECIFICATION Spec
CONSTANTS
    Automations = {"a1", "a2"}
    MaxTime = 3
    AllowDuplicate = FALSE
    AllowOverlap = FALSE
    AllowDisabled = TRUE
    AllowEarly = FALSE
INVARIANTS
    TypeOK
    NoDuplicateRun
    AtMostOneRunPerAutomation
    DisabledNeverRuns
    OnlyDueSlotsRun
