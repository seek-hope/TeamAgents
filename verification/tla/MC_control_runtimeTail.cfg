\* Negative control (D-71): the runtime treats its own closing note as work the
\* model still has to address. That is the pre-fix shape in the other direction:
\* a settlement (or a turn the runtime closed) would immediately re-open a turn
\* against the runtime's own words — the runtime inventing work out of its own
\* ending. TLC must report `NoTurnWithoutWork` violated; MC.cfg is the same
\* configuration with `RuntimeTailIsWork = FALSE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Instances = {"L"}
    Ops = {"o1"}
    ReqIds = {1, 2}
    AttIds = {1}
    ApprovalOps = {"o1"}
    TokenLimit = 2
    MaxEpoch = 1
    MaxUnknown = 1
    AllowMidTurnInput = FALSE
    ReaskAfterReply = FALSE
    RuntimeTailIsWork = TRUE
    IgnoreDeadline = FALSE
    ReleaseOnCancel = TRUE
    PerInstanceFairness = TRUE
INVARIANTS
    TypeOK
    NoTurnWithoutWork
    InputLandsAtTheBoundary
