\* expects: BriefingIsForAGoalWithChecks
\* Negative control (D-418): the runtime tells the instance about checks the goal does not require — a criterion
\* that does not exist is worse than none, because the model would satisfy a contract nobody asked for. TLC must
\* report `BriefingIsForAGoalWithChecks` violated; MC_checks_briefing.cfg is the same configuration with
\* `BriefWithoutChecks = FALSE` and verifies.
SPECIFICATION Spec
CONSTANTS
    AllChecks = {"k1", "k2"}
    Independent = FALSE
    SelfVerified = FALSE
    RewindRounds = FALSE
    LateRequire = FALSE
    BriefWithoutChecks = TRUE
    MaxRounds = 2
INVARIANTS
    TypeOK
PROPERTIES
    BriefingIsForAGoalWithChecks
