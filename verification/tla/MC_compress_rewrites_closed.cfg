\* Negative control (D-219): a late failure rewrites a compression request that
\* already closed — the request record is not final after all. TLC must report
\* `RequestClosesOnce` violated (the claim is a monitor since D-219: written as a
\* disjunction over `RequestState` it was entailed by `TypeOK` and could not
\* fail); the same configuration with `ReopenClosedRequest = FALSE`
\* (MC_compress.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Slots = {0, 1, 2, 3, 4}
    Reqs = {"r1", "r2"}
    DeleteCoveredEntries = FALSE
    ReopenCoveredEntries = FALSE
    ReopenClosedRequest = TRUE
INVARIANTS
    TypeOK
    RequestClosesOnce
