\* expects: NothingThatShouldStayLeaves
SPECIFICATION Spec
CONSTANTS
    \* Each guard protects one session of its own, so no counterfactual is masked by another: `d` is inside the
    \* window, `e` is past it but undated, `a` is dated but served, `b` is dated but marked, and `c` and `f` are the ones
    \* this prune may take (two steps, so the monitor is checked across more than one removal).
    Sessions = {"a", "b", "c", "d", "e", "f"}
    WindowPassed = {"a", "b", "c", "e", "f"}
    Dated = {"a", "b", "c", "d", "f"}
    Served = {"a"}
    Marked = {"b"}
    IgnoreWindow = FALSE
    KeepPresent = FALSE
    IgnoreDating = FALSE
    IgnoreLive = TRUE
    IgnoreEvidence = FALSE
INVARIANTS
    TypeOK
    NothingThatShouldStayLeaves
    TakenIsGone
