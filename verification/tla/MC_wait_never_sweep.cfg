\* expects: NoStrandedPending
\* Negative control (D-462): no sweep ever closes a satisfied wait, so a pending one is stranded.
SPECIFICATION Spec
CONSTANTS
    Waits = {"w1", "w2"}
    Conds = {"c1", "c2"}
    Instances = {"L", "M"}
    TaskSettled = "c1"
    MessageCond = "c2"
    WidenMessageToTaskResults = FALSE
    WakeOnReport = FALSE
    WakeOnIdle = FALSE
    CloseWithoutAnswer = FALSE
    AnswerTwice = FALSE
    AnswerUnresolved = FALSE
    PendingWhileReady = FALSE
    ParkAfterAnswer = FALSE
    AnswerUnusedSlot = FALSE
    NeverSweep = TRUE
    CloseWithoutHolding = FALSE
    MismatchAnswerCall = FALSE
PROPERTIES
    NoStrandedPending
