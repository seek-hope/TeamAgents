\* Codemode, as designed (D-374/D-376): a script may call bound MCP tools, only the
\* script's own output enters the model's context, and a vetoed nested call never
\* executes.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Tools = {"t1", "t2"}
    Vetoed = {"t1"}
    IgnoreVeto = FALSE
    SilentScript = FALSE
    LeakNested = FALSE
INVARIANTS
    TypeOK
    OnlyScriptOutputEnters
    ScriptsAlwaysEmit
    VetoedNeverCalled
