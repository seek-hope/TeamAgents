\* Negative control (D-412): the PKCE verifier travels on the authorization URL — the URL the user sees,
\* the browser keeps in history and another machine may paste back — which would make PKCE pointless. TLC
\* must report `VerifierNeverLeavesTheClient` violated; MC_oauth.cfg is the same configuration with
\* `LeakVerifier = FALSE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Services = {"s1"}
    Resources = {"r1", "r2"}
    Codes = {"c1", "c2"}
    Tokens = {"t1", "t2"}
    Refreshable = {"s1"}
    MaxLife = 3
    MaxClock = 6
    IgnoreResource = FALSE
    ReuseCode = FALSE
    LeakVerifier = TRUE
    IgnoreExpiry = FALSE
    IgnoreLogout = FALSE
INVARIANTS
    TypeOK
    VerifierNeverLeavesTheClient
