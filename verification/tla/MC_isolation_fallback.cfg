\* Negative control (D-369): a command may run under another backend — the fallback that would make
\* `sandbox = "docker"` quietly a host shell. TLC must refute `RunsOnlyUnderTheConfiguredBackend`.
SPECIFICATION Spec
CONSTANTS
    Backends = {"bubblewrap", "docker", "host"}
    Configured = "docker"
    Available = {"docker", "bubblewrap", "host"}
    AllowFallback = TRUE
    AllowUnavailable = FALSE
INVARIANTS
    TypeOK
    RunsOnlyUnderTheConfiguredBackend
    UnavailableBackendNeverRuns
