\* The other half of the base configuration, named as its own configuration so the *non-vision* arm is a target
\* of its own rather than a note (D-392): with `Vision = FALSE` and the rule in place, the model is sent the
\* placeholder or the error line and never a part.
SPECIFICATION Spec
CONSTANTS
    Vision = FALSE
    BlindSendsParts = FALSE
INVARIANTS
    TypeOK
    NoImagesWithoutSupport
    PartsOnlyFromLoadedBytes
    NoLeakedImages
    NoUnbackedParts
    UnreadableIsReported
