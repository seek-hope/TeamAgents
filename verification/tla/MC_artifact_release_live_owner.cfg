\* expects: OwnerHoldsUntilItsSubjectIsFinished
\* Negative control (D-436): a hold is released although its owner has **not** finished — the mistake
\* `OwnerHoldsUntilItsSubjectIsFinished` exists to catch, and the one the product's own rule (a request that is not
\* PENDING, an operation whose status is terminal but not OUTCOME_UNKNOWN) is there to prevent. `a2` is the
\* artifact whose owner is still live and whose age would allow the release, so only that guard can stop this.
SPECIFICATION Spec
CONSTANTS
    Artifacts = {"a1", "a2", "a3"}
    Owners = {"r1", "r2"}
    \* Each guard gets a session of its own, so neither counterfactual is masked by the other — the lesson the
    \* Prune configurations learned first (D-435) and this one had to learn again: `a1` is spent *and* aged (the
    \* legitimate release), `a2` is aged but its owner is still live, `a3` is spent but inside the window.
    Spent = {"a1", "a3"}
    Aged = {"a1", "a2"}
    GcIgnoresHolders = FALSE
    ReleaseLiveOwner = TRUE
    ReleaseFreshArtifact = FALSE
INVARIANTS
    TypeOK
    OwnerHoldsUntilItsSubjectIsFinished
