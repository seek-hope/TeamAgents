\* Negative control (D-410): the runtime warns a goal that is already past its deadline. The note says time is
\* nearly up and asks the model to settle, while the gate `begin_request` applies refuses the request that would
\* answer it — a statement the runtime cannot stand behind. TLC must report `WarnIsTimely` violated;
\* MC_control_warn.cfg is the same configuration with `WarnLate = FALSE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Instances = {"L"}
    Ops = {"o1"}
    ReqIds = {1, 2}
    AttIds = {1}
    ApprovalOps = {"o1"}
    TokenLimit = 2
    MaxEpoch = 1
    MaxUnknown = 1
    WarnLate = TRUE
    WarnRepeatedly = FALSE
    MaxWarns = 2
    AllowMidTurnInput = FALSE
    ReaskAfterReply = FALSE
    RuntimeTailIsWork = FALSE
    IgnoreDeadline = FALSE
    ReleaseOnCancel = TRUE
    PerInstanceFairness = TRUE
INVARIANTS
    TypeOK
PROPERTIES
    WarnIsTimely
