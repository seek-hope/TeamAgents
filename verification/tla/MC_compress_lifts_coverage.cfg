\* Negative control (D-219): a commit lifts the coverage of the entries it
\* hides — they become visible again — instead of growing coverage monotonically.
\* TLC must report `CoverageNeverLifted` violated (the `uncovered` monitor is
\* written for the first time); the same configuration with
\* `ReopenCoveredEntries = FALSE` (MC_compress.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Slots = {0, 1, 2, 3, 4}
    Reqs = {"r1", "r2"}
    DeleteCoveredEntries = FALSE
    ReopenCoveredEntries = TRUE
    ReopenClosedRequest = FALSE
INVARIANTS
    TypeOK
    CoverageNeverLifted
    RequestClosesOnce
