\* D-248: the session's stop lever, the positive configuration. A client asks this session to stop over the
\* socket it is listening on, the daemon answers that request, and only then does the accept loop leave and take
\* the socket with it. `StopsOnlyAfterAnswering` is the receipt rule (a daemon that is gone answered every stop
\* request it took) and `AStopIsAnsweredAndEndsTheSession` is the liveness half (an answered stop really ends
\* the session). Both counterfactuals are FALSE here.
SPECIFICATION Spec
CONSTANTS
    Clients = {"c1", "c2"}
    Commands = {"x1", "x2"}
    Versions = {1, 2}
    MaxLog = 3
    ReplayRewritesReceipt = FALSE
    RollbackLog = FALSE
    ReclaimEvents = FALSE
    StopBeforeReceipt = FALSE
    KeepServingAfterReceipt = FALSE
    SkipAnEvent = FALSE
    DeliverTwice = FALSE
INVARIANTS
    TypeOK
    StopsOnlyAfterAnswering
PROPERTIES
    AStopIsAnsweredAndEndsTheSession
