\* expects: SettlementFollowsATurnAfterTheLanding
\* Negative control (D-72): the driver stores a user input *inside* the running turn
\* (the pre-D-63 shape, switch `AllowMidTurnInput`) and that turn's completion still
\* settles the goal. The input was never in the turn's fixed request, so a client
\* waiting on it would attribute a settlement its input had no part in — the
\* attribution rule the headless client applies is sound exactly because the landing
\* happens at a boundary instead. TLC must report
\* `SettlementFollowsATurnAfterTheLanding` violated; MC.cfg is the same configuration
\* with `AllowMidTurnInput = FALSE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Instances = {"L"}
    Ops = {"o1"}
    ReqIds = {1, 2}
    AttIds = {1}
    ApprovalOps = {"o1"}
    TokenLimit = 2
    MaxEpoch = 1
    MaxUnknown = 1
    WarnLate = FALSE
    WarnRepeatedly = FALSE
    MaxWarns = 2
    AllowMidTurnInput = TRUE
    ReaskAfterReply = FALSE
    RuntimeTailIsWork = FALSE
    IgnoreDeadline = FALSE
    ReleaseOnCancel = TRUE
    PerInstanceFairness = TRUE
    BadAdmission = FALSE
    BadActiveRequest = FALSE
    EffectBeforeDispatch = FALSE
    KeepClosedReservation = FALSE
    OverReserve = FALSE
    SelectIncomplete = FALSE
    StaleExecutor = FALSE
    DoubleEffect = FALSE
    RewriteTerminalOp = FALSE
    RewriteTerminalGoal = FALSE
    CrossEpochReceipt = FALSE
    EffectUnauthorized = FALSE
    EffectOnTerminated = FALSE
    EffectAfterCancel = FALSE
    PreparedEffect = FALSE
INVARIANTS
    TypeOK
    SettlementFollowsATurnAfterTheLanding
