\* Negative control (D-291): the commit waits for every reader to catch up — a per-client queue a slow client
\* fills — so a reader that never runs starves the writer. TLC must report `WriterProgressesDespiteAStalledReader`
\* violated (the writer commits once, when the readers happen to be caught up, and is blocked from then on); the
\* same configuration with `WriterWaitsForReaders = FALSE` (MC_concurrency.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Readers = {"r1", "r2"}
    MaxEvents = 3
    WriterWaitsForReaders = TRUE
    ReaderMaySkip = FALSE
    ReaderMayRunAhead = FALSE
INVARIANTS
    TypeOK
    ReadersSeeTheCommittedPrefix
    NoReaderSeesUncommitted
PROPERTIES
    WriterProgressesDespiteAStalledReader
