\* Negative control (§5.3): the inbox simply grows, so the bound that gives
\* backpressure its meaning is gone. TLC must report `BoundedInbox` violated.
SPECIFICATION Spec
CONSTANTS
    MaxInbox = 2
    ApplyWithoutDedup = FALSE
    DropWhenFull = FALSE
    OverflowInbox = TRUE
    ApplySealed = FALSE
    AnyInstanceDrains = FALSE
INVARIANTS
    TypeOK
    AtMostOncePerEnvelope
    LogIsIncreasing
    NoSilentLoss
    NoStaleApplication
    DrainIsOwned
    BoundedInbox
