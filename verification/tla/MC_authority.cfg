\* The user's authority surface as the code states it (D-61): the bootstrap's
\* grants, one free slot for the user's own grant (or for the grant a spawn
\* derives), one worker, and the two operations that matter — the worker's
\* workspace shell (which only a user grant authorizes) and the leader's
\* delegation (which the bootstrap covers). Kept deliberately small: this module
\* is about the surface, V2Grants is about the full bootstrap.
SPECIFICATION Spec
CONSTANTS
    Instances = {"leader", "worker"}
    Actions = {"shell", "manage", "delegate", "message"}
    GrantIds = {"g1", "g2", "g3", "g4"}
    BaseTools = {"files"}
    ViewFields = {"id", "issuer", "subject", "action", "scope", "revoked"}
    Granter = "user"
    CascadeOverReaches = FALSE
    SurfaceFromAnotherInstance = FALSE
    SpawnDelegable = FALSE
    TaskChildDelegable = FALSE
    GhostGrant = FALSE
    ExtraBootstrap = FALSE
    OrphanChild = FALSE
    WiderChild = FALSE
    TwoEffects = FALSE
    ListGhost = FALSE
    DeadPair = FALSE
    StaleEffect = FALSE
    ReviveOnRevoke = FALSE
    TrustSurface = FALSE
    RefreshSurface = TRUE
INVARIANTS
    TypeOK
    NoDeadGrantPair
    ListedIdsAreUsed
    AuthorityTracesToTheUser
    RevokedStaysRevoked
    ChildGrantsAreCoveredByTheirParent
    CascadeTakesTheSubtree
    EffectAtMostOnce
    OnceStaleNeverExecutes
    BootstrappedAuthority
    DelegableGrantsAreUserIssued
    TaskScopedGrantsAreNonDelegable
PROPERTIES
    CascadeOnlyTakesTheSubtree
    EveryLiveGrantBecomesRevocable
    AuthorizedEffectsOnly
    SurfaceChangesOnlyToTheCurrentEntitlement
    StaleSurfaceCatchesUp
