\* Negative control (D-253): the maintenance pass takes the lock although a session's driver holds it — the
\* sweep and a driver writing the same state root together, which the lock exists to prevent. The counterfactual
\* is the one this module already carries (`NotExclusive` removes the kernel's exclusivity for every acquirer,
\* the sweep included), and TLC must report `SweepWaitsForTheSession` violated; the same configuration with
\* `NotExclusive = FALSE` (MC_coordinator.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    ReportInsteadOfWaiting = FALSE
    ChildKeepsLock = FALSE
    NotExclusive = TRUE
INVARIANTS
    TypeOK
    SweepWaitsForTheSession
