\* Negative control (D-192): the sweep forgets the evaluation-evidence guard, so
\* a fact that is part of a recorded evaluation is dropped. TLC must refute
\* `EvidenceIsNeverEvicted` (and the step property with it).
SPECIFICATION Spec
CONSTANTS
    Facts = {"e1", "e2", "e3"}
    Live0 = {"e2"}
    Evidence0 = {"e3"}
    Horizon = 2
    MaxAge = 3
    IgnoreLive = FALSE
    IgnoreEvidence = TRUE
    IgnoreAge = FALSE
    IgnoreDisabled = FALSE
INVARIANTS
    TypeOK
    NoReferenceToEvictedFact
    EvidenceIsNeverEvicted
    OnlyOldFactsAreEvicted
PROPERTIES
    EvictionOnlyUnderTheGuards
