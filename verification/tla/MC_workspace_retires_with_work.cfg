\* Negative control (D-76): retirement deletes the checkout although it still holds uncommitted or unmerged
\* work — the loss the documented refusal exists to prevent. TLC must report `RetirementNeverBuriesWork`
\* violated (the `buried` monitor is written for the first time); the same configuration with
\* `RetireBuryingWork = FALSE` (MC_workspace.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    MergeWithoutChecking = FALSE
    RetireBuryingWork = TRUE
INVARIANTS
    TypeOK
    RetirementNeverBuriesWork
