\* Negative control (D-364): `New` may put two ids on one path, which is two sessions in one state root.
\* TLC must refute `RegistryIsInjective`.
SPECIFICATION Spec
CONSTANTS
    Ids = {"default", "a", "b"}
    Paths = {"p1", "p2", "p3"}
    AllowSharedPath = TRUE
    ArchiveWhileHeld = FALSE
    AllowDefaultArchive = FALSE
INVARIANTS
    TypeOK
    RegistryIsInjective
    NoCoordinatorForAnArchivedSession
    DefaultIsNeverArchived
PROPERTIES
    ArchiveOnlyWhenIdle
