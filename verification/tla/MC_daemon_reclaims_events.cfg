\* Negative control (D-219): the daemon reclaims events, so a client whose
\* watermark predates the reclaim does need a resync — the one thing this version
\* promises never to ask for. TLC must report `NoResyncInThisVersion` violated
\* (the `pruned` variable is written for the first time); the same configuration
\* with `ReclaimEvents = FALSE` (MC_daemon.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Clients = {"c1", "c2"}
    Commands = {"x1", "x2"}
    Versions = {1, 2}
    MaxLog = 3
    ReplayRewritesReceipt = FALSE
    RollbackLog = FALSE
    ReclaimEvents = TRUE
INVARIANTS
    TypeOK
    NoResyncInThisVersion
