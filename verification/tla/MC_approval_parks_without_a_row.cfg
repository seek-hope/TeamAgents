\* Negative control (D-225): a gated operation parks without an approval row, so
\* the user has nothing to decide and the operation waits on a decision that can
\* never come — the state `park_operation` avoids by writing the PENDING row in
\* the same transaction. TLC must report `ParkedHasAnApprovalRow` violated; the
\* same configuration with `ParksWithoutARow = FALSE` (MC_approval.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Ops = {"o1", "o2"}
    MaxTime = 3
    DropsExpiryCheck = FALSE
    RewritesDecisions = FALSE
    KeepsPendingOnClose = FALSE
    ParksWithoutARow = TRUE
INVARIANTS
    TypeOK
    ParkedHasAnApprovalRow
