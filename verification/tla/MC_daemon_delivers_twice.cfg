\* Negative control (D-249): a batch counts one event it did not hand over — the duplicate a client that
\* re-read behind its watermark would produce (the same range served twice), and the other half of "each event
\* once". TLC must report `NothingIsServedTwice` violated (the count runs ahead of the distinct sequences
\* served); the same configuration with `DeliverTwice = FALSE` (MC_daemon.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Clients = {"c1", "c2"}
    Commands = {"x1", "x2"}
    Versions = {1, 2}
    MaxLog = 3
    ReplayRewritesReceipt = FALSE
    RollbackLog = FALSE
    ReclaimEvents = FALSE
    StopBeforeReceipt = FALSE
    KeepServingAfterReceipt = FALSE
    SkipAnEvent = FALSE
    DeliverTwice = TRUE
INVARIANTS
    TypeOK
    NothingIsServedTwice
