\* Negative control (D-61): the model-visible surface is computed once and never
\* recomputed — a driver that cached the instance's tool list across turns. The
\* code recomputes it at every request (driver::team_kernel), which is what makes
\* a user's grant visible at all.
\* TLC must report `StaleSurfaceCatchesUp` violated: after the grant the worker is
\* entitled to the shell and its surface never catches up.
SPECIFICATION Spec
CONSTANTS
    Instances = {"leader", "worker"}
    Actions = {"shell", "manage", "delegate", "message", "task_result"}
    GrantIds = {"g1", "g2", "g3", "g4"}
    BaseTools = {"files"}
    ViewFields = {"id", "issuer", "subject", "action", "scope", "revoked"}
    Granter = "user"
    TrustSurface = FALSE
    RefreshSurface = FALSE
INVARIANTS
    TypeOK
    NoDeadGrantPair
    ListedIdsAreUsed
    AuthorityTracesToTheUser
    RevokedStaysRevoked
    ChildGrantsAreCoveredByTheirParent
    CascadeTakesTheSubtree
    EffectAtMostOnce
    OnceStaleNeverExecutes
    BootstrappedAuthority
PROPERTIES
    StaleSurfaceCatchesUp
