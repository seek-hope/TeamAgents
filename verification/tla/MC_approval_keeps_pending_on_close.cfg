\* Negative control (D-225): an operation closes with its approval still PENDING,
\* so a decision the user makes afterwards lands on a settled operation — the
\* state `expire_pending_approvals` (run in the closing transaction) exists to
\* prevent. TLC must report `TerminalOperationHasNoPendingApproval` violated; the
\* same configuration with `KeepsPendingOnClose = FALSE` (MC_approval.cfg)
\* verifies.
SPECIFICATION Spec
CONSTANTS
    Ops = {"o1", "o2"}
    MaxTime = 3
    DropsExpiryCheck = FALSE
    RewritesDecisions = FALSE
    KeepsPendingOnClose = TRUE
    ParksWithoutARow = FALSE
INVARIANTS
    TypeOK
    TerminalOperationHasNoPendingApproval
