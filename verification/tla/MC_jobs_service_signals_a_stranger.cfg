\* Negative control (D-251): the service stop signals the recorded group id without checking that the group is
\* still the job's own — the shape that reaches a stranger's group when the kernel has handed the id out again
\* (whose members were born after the job ended). TLC must report `OnlyTheJobsOwnGroupIsSignalled` violated (the
\* `stranger` monitor is written for the first time); the same configuration with
\* `SignalWithoutChecking = FALSE` (MC_jobs.cfg) verifies — including the world where the id *was* recycled,
\* which the lever then refuses.
SPECIFICATION Spec
CONSTANTS
    GuessNotRun = FALSE
    DoubleGo = FALSE
    LateGoStarts = FALSE
    SpawnBeforeAccept = FALSE
    RetireWithAChild = FALSE
    SignalWithoutChecking = TRUE
INVARIANTS
    TypeOK
    OnlyTheJobsOwnGroupIsSignalled
