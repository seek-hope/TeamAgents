\* Negative control (D-412): the client presents a token to an endpoint it was not requested for. TLC must
\* report `TokenOnlyToItsResource` violated; MC_oauth.cfg is the same configuration with
\* `IgnoreResource = FALSE` and verifies.
SPECIFICATION Spec
CONSTANTS
    Services = {"s1"}
    Resources = {"r1", "r2"}
    Codes = {"c1", "c2"}
    Tokens = {"t1", "t2"}
    Refreshable = {"s1"}
    MaxLife = 3
    MaxClock = 6
    IgnoreResource = TRUE
    ReuseCode = FALSE
    LeakVerifier = FALSE
    IgnoreExpiry = FALSE
    IgnoreLogout = FALSE
INVARIANTS
    TypeOK
    TokenOnlyToItsResource
