\* Two-instance control-plane configuration (D-63): the same domains as MC.cfg but
\* two instances, so a *per instance* liveness or fairness assumption can be told
\* apart from one that lets one instance's progress carry the other's starvation.
\* The wide configuration is the broader, slow one; this is the small two-instance
\* check that runs with `make verify-model-all`.
SPECIFICATION Spec
CONSTANTS
    Instances = {"L", "W"}
    Ops = {"o1"}
    ReqIds = {1, 2}
    AttIds = {1}
    ApprovalOps = {}   \* the approval gate is the one-instance configuration's subject
    TokenLimit = 2
    MaxEpoch = 0
    MaxUnknown = 0
    AllowMidTurnInput = FALSE
    IgnoreDeadline = FALSE
    PerInstanceFairness = TRUE
INVARIANTS
    TypeOK
    NoEffectBeforeApproval
    RecordBeforeEffect
    EffectAtMostOnce
    ReservationsAdmitted
    ReservationReleased
    OneActiveRequest
    SelectionIsComplete
    NoTurnWithoutWork
    StaleExecutorRejected
    NoEffectOnTerminated
    PreparedIsNotTerminal
    CancelledBeforeStartHasNoEffect
    InputLandsAtTheBoundary
PROPERTIES
    NoRequestAfterDeadline
    QueuedInputEntersTheContext
