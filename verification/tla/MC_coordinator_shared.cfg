\* Negative control (A33): the lock is not exclusive, so two coordinators hold
\* it. TLC must report `AtMostOneCoordinator` violated — §6.1 is one
\* coordinator per state root.
SPECIFICATION Spec
CONSTANTS
    ReportInsteadOfWaiting = FALSE
    ChildKeepsLock = FALSE
    NotExclusive = TRUE
INVARIANTS
    TypeOK
    AtMostOneCoordinator
    TheWindowIsNotMistakenForAHolder
    NoHeldLockWithoutAHolder
PROPERTIES
    RecoveryIsLive
