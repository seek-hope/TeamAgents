\* Negative control (A31): the latch clears although nothing could be written. TLC
\* must report `LatchClearsOnlyWhenWritable` violated — clearing is the park landing,
\* and a park cannot land without a write.
SPECIFICATION Spec
CONSTANTS
    KeepDriving = FALSE
    FakeSuccess = FALSE
    ParkSilently = FALSE
    ClearAnyway = TRUE
INVARIANTS
    TypeOK
    NoStepRunsWhileLatched
    NoFakedSuccess
    LossIsReported
    LatchClearsOnlyWhenWritable
PROPERTIES
    ParkEventuallyLands
