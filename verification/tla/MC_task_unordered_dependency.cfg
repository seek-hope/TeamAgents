\* Negative control (D-218): a prerequisite may be the task itself or one that does
\* not exist yet — both dependency conditions dropped, which is what makes
\* delegation build an acyclic graph out of already-created tasks. TLC must report
\* `DependenciesPointBackwards` violated, with the state that breaks it also
\* breaking `NoSelfDependency`; the same configuration with
\* `AllowUnorderedDependency = FALSE` (MC_task.cfg, MC_task_two.cfg) verifies.
SPECIFICATION Spec
CONSTANTS
    Tasks = {"t1"}
    Instances = {"L", "W"}
    Goals = {"g1", "g2"}
    MaxOps = 1
    DelegateToSettledGoal = FALSE
    BillSettledGoal = FALSE
    AllowUnorderedDependency = TRUE
    LeaveTasksOnTerminate = FALSE
INVARIANTS
    TypeOK
    SystemOnlyParksTasks
    OnlyPartiesWriteTasks
    ReturnPathOnlyWhileOpen
    DependenciesPointBackwards
    NoSelfDependency
    NoOpenTaskOnDeadAssignee
    SettledIsFinal
    NoStaleActiveGoal
    RegisteredWorkNeedsAnActiveGoal
    RequestsResolveToActiveGoals
