\* Automations, as designed (D-367): a slot is never run twice, a run never overlaps another of the same
\* automation, a paused automation never runs, and a run starts only at its due slot.
SPECIFICATION Spec
CONSTANTS
    Automations = {"a1", "a2"}
    MaxTime = 3
    AllowDuplicate = FALSE
    AllowOverlap = FALSE
    AllowDisabled = FALSE
    AllowEarly = FALSE
INVARIANTS
    TypeOK
    NoDuplicateRun
    AtMostOneRunPerAutomation
    DisabledNeverRuns
    OnlyDueSlotsRun
