\* Negative control (A06): the context append ignores the envelope id it already
\* applied, so a replay after a lost marker applies the envelope a second time.
\* TLC must report `AtMostOncePerEnvelope` violated (and with it
\* `LogIsIncreasing`, since the replay appends an older id at the tail).
SPECIFICATION Spec
CONSTANTS
    MaxInbox = 2
    ApplyWithoutDedup = TRUE
    DropWhenFull = FALSE
    OverflowInbox = FALSE
    ApplySealed = FALSE
    AnyInstanceDrains = FALSE
INVARIANTS
    TypeOK
    AtMostOncePerEnvelope
    LogIsIncreasing
    NoSilentLoss
    NoStaleApplication
    DrainIsOwned
    BoundedInbox
