# Standalone crate for the Kani proofs: compiles the repository's kernel/types.rs
# (see verification/README.md and the verify-kani target in the Makefile)
[package]
name = "teamagents-kani-probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[lib]
path = "src/lib.rs"
