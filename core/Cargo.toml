[package]
name = "teamagents-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

[lib]
path = "src/lib.rs"

[[bin]]
name = "teamagents-core"
path = "src/main.rs"
