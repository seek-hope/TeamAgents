name: Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  package:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Match the tag to the Cargo package
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo pkgid --locked -p teamagents | sed 's/.*[#@]//')
          test "$GITHUB_REF_NAME" = "v$version"
      - run: make package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-x86_64
          path: target/dist/
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.TEAMAGENTS_RELEASE_APPROVED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64
          path: dist
      - name: Publish the checked package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md dist/*.tar.gz dist/SHA256SUMS
