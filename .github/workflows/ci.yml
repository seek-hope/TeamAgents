name: Rust CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare the Linux workspace sandbox
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap slirp4netns
          /usr/bin/slirp4netns --version
          probe() {
            /usr/bin/bwrap --unshare-user --disable-userns --unshare-net --unshare-pid --ro-bind /usr /usr \
              --symlink usr/lib /lib --symlink usr/lib64 /lib64 /usr/bin/true
          }
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r $knob && $(<"$knob") == 1 ]] && ! probe; then
            # Ubuntu may require an executable-specific grant for user namespaces.
            sudo apparmor_parser -r <<'PROFILE'
          abi <abi/4.0>,
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          fi
          probe
      # rustup reads rust-toolchain.toml, including the rustfmt and clippy components.
      - run: make check
