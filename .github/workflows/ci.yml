name: Rust CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量历史：shallow clone 下 HEAD 没有 parent，`git log --check -1`
          # 会把整棵树当成"本提交新增"，历史文件里的行尾空格全被算到这次提交头上
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # GitHub runner 装了 bubblewrap 也用不了（内核/AppArmor 限制非特权 user namespace），
      # 所以这里不装：依赖真实隔离的测试会打印 "skipped: bwrap is unavailable" 自行跳过，
      # 它们的权威验证在有 bwrap 的开发机上（见 docs/ACCEPTANCE.md）。
      - name: Test core
        run: cargo test --manifest-path core/Cargo.toml
      - name: Test engine
        run: cargo test --manifest-path engine/Cargo.toml
      - name: Test TUI
        run: cargo test --manifest-path tui/Cargo.toml
      # `git diff --check` 在干净检出上恒为空，检查的是提交本身
      - name: Check patch whitespace
        run: git log --check --format= -1
