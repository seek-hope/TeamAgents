name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: with a shallow clone HEAD has no parent, so `git log --check -1`
          # treats the whole tree as new and blames this commit for pre-existing whitespace.
          fetch-depth: 0
      - name: Read the pinned toolchain version
        id: rust-version
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: rustfmt, clippy
      # bubblewrap does not work on GitHub runners (the kernel/AppArmor forbids unprivileged
      # user namespaces), so it is not installed: tests that need real isolation print
      # "skipped: bwrap is unavailable" and their authoritative runs happen on a dev machine
      # with bwrap (see docs/ACCEPTANCE.md).
      - name: Format and Clippy
        run: make fmt-check lint CARGO_FLAGS=--locked
      - name: Regression tests for the three crates
        run: make test CARGO_FLAGS=--locked
      - name: Repository hygiene
        run: make hygiene
      # `git diff --check` is always empty on a clean checkout; it checks the commit itself
      - name: Check patch whitespace
        run: git log --check --format= -1
