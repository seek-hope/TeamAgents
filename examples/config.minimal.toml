# TeamAgents starter config. Credentials are referenced by env var name, never written.
# When you change the model, set that model's native context_window too.
# Other services, web search and MCP are documented in examples/config.toml.
skills_paths = ["~/.agents/skills"]

[models.leader_main]
provider = "deepseek"
protocol = "deepseek"
model = "deepseek-flash"
context_window = 1000000
api_key_env = "DEEPSEEK_API_KEY"
timeout = 120
max_retries = 2
generation_options = { reasoning_effort = "max" }
