# TeamAgents starter config. Credentials are referenced by env var name, never written.
# When you change the model, set that model's native context_window too.
# Other services, web search and MCP are documented in examples/config.toml.
skills_paths = ["~/.agents/skills"]

[models.leader_main]
provider = "deepseek"
protocol = "deepseek"
model = "deepseek-flash"
context_window = 1000000
api_key_env = "DEEPSEEK_API_KEY"
timeout = 120
max_retries = 2
generation_options = { reasoning_effort = "max" }

# Acceptance checks (optional): machine contracts the runtime runs at the
# completion boundary, in the isolated shell, before a goal may be reported as
# done. A failing check sends the work back for repair and then blocks the goal
# instead of letting a summary claim success. They can only come from this user
# config, never from a cloned project.
# [[checks]]
# id = "tests"
# command = "cargo test --offline"
# inputs = ["src", "Cargo.toml"]   # optional: hashes bind the result to these inputs
# timeout = 600                    # optional seconds (default: the shell tool's)
# network = false                  # optional: the sandbox is offline by default

# Usage and wall-clock ceilings for every goal this session creates (optional;
# without them a goal runs until you stop it). Both are yours alone: a cloned
# project cannot set them. doctor reports what is in force.
# [limits]
# max_total_tokens = 2000000   # refuse a new request past this usage (A18)
# deadline_minutes = 45        # refuse a new request past this deadline (A35)
