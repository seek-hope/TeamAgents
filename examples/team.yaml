# 示例团队：单 Leader + 一个 Codex 执行成员（对应 examples/config.toml 的 profile 名）
schema_version: 1
leader_id: leader
agents:
  - id: leader
    name: Leader
    role: leader
    runtime_kind: deepagents
    instructions: 理解用户目标，按需组队，协调执行并交付结果。
    model_profile: leader_main
    tool_bindings: [files, shell, web, fetch]
    skills: []
    workspace_policy: shared
  - id: codex_dev
    name: Codex Dev
    role: worker
    runtime_kind: codex
    instructions: 执行委派的编码/终端任务，报告进度与结果。
    model_profile: coding          # 映射为 codex -c model_provider/model
    tool_bindings: [files, shell]
    skills: []
    workspace_policy: shared
channels:
  - source: leader
    targets: [codex_dev]
    mode: task
  - source: codex_dev
    targets: [leader]
    mode: message
observers: []
shared_spaces:
  - id: main
    readers: [leader, codex_dev]
    writers: [leader, codex_dev]
limits:
  max_parallel_workers: 8
  max_members: 20
  max_turns_per_goal: 1000
