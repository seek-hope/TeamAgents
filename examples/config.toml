# TeamAgents 用户配置示例 -> ~/.config/teamagents/config.toml
# 密钥只引用环境变量，不写进本文件。

# 协议（protocol）决定线上格式，三种主流格式都已支持：
#   protocol = "responses"   → POST {base_url}/responses（OpenAI 官方模型、Codex 风格网关）
#   protocol = "anthropic"   → POST {base_url}/v1/messages（Anthropic 官方订阅/兼容网关）
#   protocol = "openai"      → POST {base_url}/chat/completions（OpenAI 兼容：DeepSeek/GLM/Kimi/…）
#   protocol = "deepseek"    → 同 chat/completions，另外把 xhigh 档位映射成 max
# 具体用哪个模型由 base_url + model 决定；官方订阅的模型名写进 model 即可。

# 归档会话保留：v2 目前只在 `teamagents doctor` 里报告这段配置，自动清理尚未落地；
# 不配就是什么都不删。需要时才填写，别指望它现在就自动清理历史。
# [retention]
# archived_days = 30     # 归档会话超过 N 天在打开会话时删除
# history_days = 30      # 会话库里的已受理投递与旧事件超过 N 天清理（未受理的投递一定保留）

# 事件钩子（可选）：发生这些事件时执行你的命令，事件 JSON 从 stdin 进来、事件名是最后一个参数
# 事件：tool_call / run_completed / run_failed / run_cancelled / run_paused / team_action
# 注意：钩子是"你自己写的程序"，在主机上以你的权限运行（不进沙箱）；超时 10 秒后被杀掉，不阻塞回合。
# [hooks]
# notify = ["/home/you/bin/teamagents-notify.sh"]      # 事件通知（异步、不阻塞）
# pre_tool = ["/home/you/bin/teamagents-policy.sh"]    # 执行前策略：exit 0 放行 / exit 2 拒绝（stderr 作原因）

[models.leader_main]
provider = "deepseek"
protocol = "deepseek"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
timeout = 120
max_retries = 2
generation_options = { reasoning_effort = "max" }    # 默认档位；测试用 high（max 简单回合≈240s）

