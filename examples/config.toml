# TeamAgents 用户配置示例 -> ~/.config/teamagents/config.toml
# 密钥只引用环境变量，不写进本文件。

[models.leader_main]
provider = "deepseek"
protocol = "deepseek"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
timeout = 120
max_retries = 2
generation_options = { reasoning_effort = "max" }    # 默认档位；测试用 high（max 简单回合≈240s）

[models.research]
provider = "deepseek"
protocol = "deepseek"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
generation_options = { reasoning_effort = "max" }    # 默认档位；测试用 high（max 简单回合≈240s）

[models.coding]
provider = "deepseek"
protocol = "deepseek"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
generation_options = { reasoning_effort = "max" }    # 默认档位；测试用 high（max 简单回合≈240s）

