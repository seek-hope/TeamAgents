# TeamAgents user config sample -> ~/.config/teamagents/config.toml
# Credentials are referenced by environment variable name, never written here.

# The protocol selects the wire format; all three mainstream formats are supported:
#   protocol = "responses"   -> POST {base_url}/responses   (OpenAI models and Responses-style gateways)
#   protocol = "anthropic"   -> POST {base_url}/v1/messages (Anthropic and compatible gateways)
#   protocol = "openai"      -> POST {base_url}/chat/completions (OpenAI-compatible: DeepSeek/GLM/Kimi/...)
#   protocol = "deepseek"    -> same as chat/completions, plus mapping xhigh to max
# base_url + model decide which service is reached; for a subscription, write the public model name.

# Retention: today `teamagents doctor` only reports this section; automatic cleanup is not
# implemented yet, so nothing is deleted unless you delete it yourself.
# [retention]
# archived_days = 30     # delete archived sessions untouched for N days
# history_days = 30      # drop applied deliveries and old events after N days (pending ones are kept)

# Event hooks (optional): hooks are your own programs, running on the host with your
# permissions (outside the sandbox).
#   notify   event notification: asynchronous, never blocks a turn, killed after 10s; the event
#            name is argv[1] and the event JSON arrives on stdin. Events: tool_call (with
#            tool/arguments/ok/error) / team_action / run_completed /
#            run_failed / run_cancelled / run_paused。
#   pre_tool runs before every native tool call: exit 0 allows, exit 2 denies (the first
#            stderr line is the reason handed to the model); other exit codes, spawn failures
#            and timeouts allow and only log to stderr. Replays after recovery are not re-asked.
# [hooks]
# notify = ["/home/you/bin/teamagents-notify.sh"]
# pre_tool = ["/home/you/bin/teamagents-policy.sh"]

[models.leader_main]
provider = "deepseek"
protocol = "deepseek"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
timeout = 120
max_retries = 2
generation_options = { reasoning_effort = "max" }    # default effort; tests use high (max takes ~240s per simple turn)

