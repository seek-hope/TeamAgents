# --- tool bindings (instances reference them by name; binding is the authorization) ---

[tools.web]
kind = "web_search"
provider = "anysearch"
url = "https://api.anysearch.com/v1/search"
api_key_env = "ANYSEARCH_API_KEY"

[tools.fetch]
kind = "web_fetch"
provider = "anysearch"

