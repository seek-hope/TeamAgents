# --- 工具绑定（成员通过名字引用；绑定即授权） -------------------------------

[tools.web]
kind = "web_search"
provider = "anysearch"
url = "https://api.anysearch.com/v1/search"
api_key_env = "ANYSEARCH_API_KEY"

[tools.fetch]
kind = "web_fetch"
provider = "anysearch"

