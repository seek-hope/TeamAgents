[project]
name = "teamagents"
version = "0.1.0"
description = "TeamAgents - terminal team agent runtime (Leader + members, delegation, parallel work)"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.13",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "langchain-anthropic>=1.7.2",
    "langchain-deepseek>=1.1.0",
    "langchain-mcp-adapters>=0.3.2",
    "pydantic>=2.13.5",
    "textual>=8.2.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0"]

[project.scripts]
teamagents = "teamagents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teamagents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = [
    "live: talks to real providers / the local Codex CLI (run with -m live)",
]
