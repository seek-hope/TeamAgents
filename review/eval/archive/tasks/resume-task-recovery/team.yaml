schema_version: 1
leader_id: leader
agents:
  - id: leader
    name: Leader
    role: leader
    runtime_kind: deepagents
    instructions: 理解目标、把执行类工作派给 dev 并等它完成；发现任务卡住时按团队规则收尾。
    model_profile: leader_main
    tool_bindings: [files, shell]
    skills: []
    workspace_policy: shared
  - id: dev
    name: Dev
    role: worker
    runtime_kind: deepagents
    instructions: 执行派给你的任务，按任务里写明的命令原样执行并如实报告结果。
    model_profile: leader_main
    tool_bindings: [files, shell]
    skills: []
    workspace_policy: shared
channels:
  - source: leader
    targets: [dev]
    mode: message
  - source: dev
    targets: [leader]
    mode: message
observers: []
shared_spaces:
  - id: main
    readers: [leader, dev]
    writers: [leader, dev]
limits:
  max_parallel_workers: 4
  max_members: 10
  max_turns_per_goal: 200
