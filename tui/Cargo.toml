[package]
name = "teamagents-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
time = { version = "0.3", features = ["formatting", "local-offset"] }

[lib]
name = "teamagents_tui"
path = "src/lib.rs"

[[bin]]
name = "teamagents-tui"
path = "src/main.rs"
