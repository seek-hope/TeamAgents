[package]
name = "teamagents-tui"
version = "0.2.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-width = "0.2"
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts"] }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
mermaid-text = "=0.57.0"
layout-rs = "0.1.3"
base64 = "0.22"
percent-encoding = "2"
rustix = { version = "1", features = ["fs"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
uuid = { version = "1", features = ["v4"] }

[lib]
name = "teamagents_tui"
path = "src/lib.rs"

[[bin]]
name = "teamagents-tui"
path = "src/main.rs"
