[package]
name = "teamagents"
version = "0.5.0"
edition = "2021"
description = "A small, persistent swarm of individually addressable coding agents"
publish = false

[dependencies]
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
