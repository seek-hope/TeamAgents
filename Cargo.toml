[package]
name = "teamagents"
version = "0.5.0"
edition = "2021"
description = "A small, persistent swarm of individually addressable coding agents"
publish = false

[dependencies]
base64 = "0.22"
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
ring = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
ureq = { version = "2", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
